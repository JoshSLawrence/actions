[tools]
# Repo lint tooling (pre-commit hooks use the system actionlint/shellcheck)
actionlint = "1.7.12"
pre-commit = "4.6.2"
shellcheck = "0.11.0"

# Used to lint and exercise tests/fixtures/ locally. Keep these in sync with
# the fallback versions in opentofu/scripts/setup-tools.sh, so the fixture is
# checked with the same versions consumers get by default.
conftest = "0.69.0"
opentofu = "1.12.6"
terraform-docs = "0.24.0"
tflint = "0.64.0"
trivy = "0.74.0"
