name: SQL project apply
description: >-
  Publishes a plan from sqlproject/plan -- exactly that plan, to the server
  and database it names. First refuses a stale plan (the PR moved on, or the
  project's files changed on the target branch since it was planned) and
  checks the plan's digest; then plans again against the live database and
  refuses if its report differs from the reviewed one; then runs SqlPackage
  Publish with the plan's own dacpac, profile and options. Download the plan
  artifact into plan-dir, sign in with azure/login, and run shared/setup
  (dotnet, dotnet:microsoft.sqlpackage, yq and azure-cli pinned) first. Gate
  the job with an environment that requires reviewers.

inputs:
  working-directory:
    description: The SQL project's folder, relative to the workspace.
    required: false
    default: "."
  plan-dir:
    description: 'Directory the plan artifact was downloaded to (default: $RUNNER_TEMP/sqlproject-plan).'
    required: false
    default: ""
  plan-sha256:
    description: The plan-sha256 output of sqlproject/plan.
    required: true
  environment:
    description: >-
      The job's GitHub environment. Only used to warn when it has no required
      reviewers (GitHub silently creates unprotected environments on first
      use), which needs actions: read.
    required: false
    default: ""
  preflight:
    description: Refuse plans that are stale (see description). Only disable if something else guarantees it.
    required: false
    default: "true"
  preflight-paths:
    description: >-
      Repository paths the plan depends on, space- or newline-separated: a
      change to any of them on the target branch since the plan makes it
      stale; an entry starting with ! excludes what it matches. Default: the
      working directory.
    required: false
    default: ""
  github-token:
    description: Token for the preflight's GitHub API calls.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Check the environment gates the apply
      shell: bash
      run: '"${GITHUB_ACTION_PATH}/../../shared/scripts/check-environment.sh"'
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        APPLY_ENVIRONMENT: ${{ inputs.environment }}

    - name: Check the plan is still current
      if: inputs.preflight == 'true'
      shell: bash
      run: '"${GITHUB_ACTION_PATH}/../../shared/scripts/apply-preflight.sh"'
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PREFLIGHT_PATHS: ${{ inputs.preflight-paths || inputs.working-directory }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        TARGET_BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
        TARGET_SHA: ${{ github.event.pull_request.base.sha || github.sha }}

    - name: Publish
      shell: bash
      run: '"${GITHUB_ACTION_PATH}/../scripts/apply.sh"'
      env:
        WORKING_DIR: ${{ inputs.working-directory }}
        PLAN_DIR: ${{ inputs.plan-dir || format('{0}/sqlproject-plan', runner.temp) }}
        PLAN_SHA256: ${{ inputs.plan-sha256 }}
        WORK_DIR: ${{ runner.temp }}/sqlproject-apply-work
