config:
  # 80 columns, except code blocks and tables (tables disable it inline with
  # <!-- markdownlint-disable MD013 --> where they can't wrap)
  MD013:
    line_length: 80
    code_blocks: false
  # Multiple top-level headings are fine in fixture READMEs rendered by
  # terraform-docs
  MD024:
    siblings_only: true
ignores:
  # Generated by terraform-docs from .header.md and the .tf files
  - tests/fixtures/*/*/README.md
