# Building your own workflow from the composite actions, for when the
# reusable workflow doesn't fit (extra steps, a different job layout). This
# is the reusable workflow's plan/apply pair, trimmed down.

name: OpenTofu (custom)

on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    outputs:
      has-changes: ${{ steps.plan.outputs.has-changes }}
      plan-sha256: ${{ steps.plan.outputs.plan-sha256 }}
      artifact-name: ${{ steps.plan.outputs.artifact-name }}
      comment-key: ${{ steps.plan.outputs.key }}
      title: ${{ steps.plan.outputs.title }}
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: JoshSLawrence/actions/opentofu/setup@v1
        with:
          working-directory: infra
          tools: opentofu tflint trivy

      - uses: JoshSLawrence/actions/opentofu/checks@v1
        with:
          working-directory: infra
          tests: false

      - name: Plan
        id: plan
        uses: JoshSLawrence/actions/opentofu/plan@v1
        with:
          working-directory: infra
          environment: production

      # Only a successful plan with changes: a failed policy check fails the
      # plan step, so a blocked plan is never uploaded
      - if: steps.plan.outputs.has-changes == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.plan.outputs.artifact-name }}
          path: ${{ steps.plan.outputs.plan-dir }}
          include-hidden-files: true
          retention-days: 7

      - if: ${{ !cancelled() && steps.plan.outputs.key != '' }}
        uses: JoshSLawrence/actions/opentofu/pr-comment@v1
        with:
          comment-key: ${{ steps.plan.outputs.key }}
          title: ${{ steps.plan.outputs.title }}
          summary-file: ${{ steps.plan.outputs.summary-file }}
          apply-environment: production
          apply-status: ${{ steps.plan.outputs.has-changes == 'true' && 'awaiting-approval' || 'none' }}

  apply:
    needs: plan
    if: needs.plan.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: opentofu-apply-infra-production
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: write
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.plan.outputs.artifact-name }}
          path: ${{ runner.temp }}/tofu-plan

      - uses: JoshSLawrence/actions/opentofu/setup@v1
        with:
          working-directory: infra

      - name: Apply
        id: apply
        uses: JoshSLawrence/actions/opentofu/apply@v1
        with:
          working-directory: infra
          plan-sha256: ${{ needs.plan.outputs.plan-sha256 }}
          environment: production

      - if: ${{ !cancelled() }}
        uses: JoshSLawrence/actions/opentofu/pr-comment@v1
        with:
          comment-key: ${{ needs.plan.outputs.comment-key }}
          title: ${{ needs.plan.outputs.title }}
          summary-file: ${{ runner.temp }}/tofu-plan/summary.md
          apply-environment: production
          apply-status: ${{ steps.apply.outcome == 'success' && 'succeeded' || 'failed' }}
