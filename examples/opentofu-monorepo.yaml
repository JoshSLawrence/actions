# A monorepo of root modules under iac/, each deployed to dev and prod:
#
#   iac/
#   ├── identity/
#   │   ├── deployments/
#   │   │   ├── dev.tfbackend     # key = "identity-dev.tfstate"
#   │   │   ├── dev.tfvars
#   │   │   ├── prod.tfbackend
#   │   │   └── prod.tfvars
#   │   ├── main.tf
#   │   └── mise.toml
#   ├── modules/                  # local modules; no mise.toml
#   └── network/
#       └── ...
#
# PRs run only the root modules they affect. Each deployment applies in the
# GitHub environment named after it (`dev`, `prod`).

name: OpenTofu

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  opentofu:
    uses: JoshSLawrence/actions/.github/workflows/opentofu.yaml@v0.1.0
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: write
    with:
      search-root: iac
      deployments: deployments/*.tfvars
      apply-environment: "{deployment}"
