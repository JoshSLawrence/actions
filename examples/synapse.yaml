# A Synapse workspace's artifacts deployed to dev and prod from its Git
# folder (synapse/): every PR validates the folder, exports its workspace
# template, compares it with each environment's workspace, and deploys each
# after its approval -- before merge. No Publish button, no
# workspace_publish branch.
#
# Setup:
# - synapse/ is the workspace's Git root folder (notebook/, pipeline/, ...),
#   with a mise.toml: 'mise use node@22 azure-cli uv' in synapse/.
# - synapse/deployments/dev.json and prod.json: ARM parameters files, each
#   setting at least workspaceName.
# - The workspaces don't allow public network access, so the plan and apply
#   jobs run on a self-hosted runner in their network, labelled
#   `synapse-vnet`; the build runs on GitHub-hosted runners.
# - Environments `dev` and `prod`, with required reviewers if your plan
#   allows.
# - Variables AZURE_CLIENT_ID, AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID,
#   and federated credentials for this repository's `pull_request`,
#   `ref:refs/heads/main`, `environment:dev` and `environment:prod`
#   subjects. The identity needs Reader on each workspace and, in Synapse
#   Studio, Synapse Artifact Publisher.
# - The workspaces' managed virtual network, managed private endpoints,
#   integration runtimes and Spark and SQL pools come from infrastructure as
#   code: by default the workflow leaves them alone
#   (deploy-managed-private-endpoints and deploy-integration-runtimes are
#   false), so it never deletes them. Create a pool, with the same name in
#   every workspace, before deploying a notebook that uses it.

name: Synapse

on:
  pull_request:
    branches:
      - main
    paths:
      - synapse/**
  push:
    branches:
      - main
    paths:
      - synapse/**
  workflow_dispatch:

permissions: {}

jobs:
  synapse:
    uses: JoshSLawrence/actions/.github/workflows/synapse.yaml@v0.6.0
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: write
    with:
      working-directory: synapse
      deployments: deployments/*.json
      resource-group: rg-{deployment}
      apply-environment: "{deployment}"
      plan-runs-on: synapse-vnet
      apply-runs-on: synapse-vnet
