# PRs only plan; the push to main plans again and applies. Simpler, but
# what gets applied is main's fresh plan rather than the one reviewed on
# the PR, and a change that fails to apply is already merged.

name: OpenTofu

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  opentofu:
    uses: JoshSLawrence/actions/.github/workflows/opentofu.yaml@v0.1.0
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: write
    with:
      search-root: infra
      apply-from-pr: false
      apply-environment: production
