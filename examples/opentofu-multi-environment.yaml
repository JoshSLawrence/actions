# One root module deployed to several environments in order: dev, then prod.
# prod only plans and applies once dev has applied (or had no changes).
#
# Each call gets its own PR comment, plan artifact and approval, because the
# apply-environment differs. Environment-scoped AZURE_* variables give each
# environment its own Azure identity without passing IDs here.

name: OpenTofu

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  dev:
    uses: JoshSLawrence/actions/.github/workflows/opentofu.yaml@v1
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: write
    with:
      working-directory: infra
      var-files: env/dev.tfvars
      backend-config: key=infra-dev.tfstate
      apply-environment: dev

  prod:
    needs: dev
    uses: JoshSLawrence/actions/.github/workflows/opentofu.yaml@v1
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: write
    with:
      working-directory: infra
      var-files: env/prod.tfvars
      backend-config: key=infra-prod.tfstate
      apply-environment: prod
      # dev already ran every check against the same code
      fmt: false
      validate: false
      tflint: false
      trivy: false
      tests: false
