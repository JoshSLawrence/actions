# One configuration deployed many times -- here once per customer -- each
# with its own variables and its own state:
#
#   app/
#   ├── customers/
#   │   ├── contoso.tfvars
#   │   ├── fabrikam.tfvars
#   │   └── ...                   # one .tfvars per customer
#   ├── main.tf
#   └── mise.toml
#
# The config is validated once; then every customer is planned, commented
# on the PR, and applied on its own. Their state keys only differ by name,
# so backend-config sets them with {deployment} instead of a .tfbackend file
# per customer (both work; a .tfbackend next to a .tfvars is added to its
# backend config).

name: OpenTofu app

on:
  pull_request:
    branches:
      - main
    paths:
      - app/**
  push:
    branches:
      - main
    paths:
      - app/**
  workflow_dispatch:

permissions: {}

jobs:
  app:
    uses: JoshSLawrence/actions/.github/workflows/opentofu-config.yaml@v1
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: write
    with:
      working-directory: app
      deployments: customers/*.tfvars
      var-files: common.tfvars
      backend-config: |
        resource_group_name=rg-tfstate
        storage_account_name=sttfstate
        container_name=tfstate
        key=app-{deployment}.tfstate
      apply-environment: production
      max-parallel: 5
