# One configuration deployed many times -- here once per customer -- each
# with its own variables and state:
#
#   app/
#   ├── customers/
#   │   ├── contoso.tfvars
#   │   └── fabrikam.tfvars
#   ├── main.tf                   # backend "azurerm" { ... } without key
#   └── mise.toml
#
# Validated once; each customer is planned and applied on its own.

name: OpenTofu app

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  app:
    uses: JoshSLawrence/actions/.github/workflows/opentofu-config.yaml@v0.1.0
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: write
    with:
      working-directory: app
      deployments: customers/*.tfvars
      backend-config: key=app-{deployment}.tfstate
      apply-environment: production
