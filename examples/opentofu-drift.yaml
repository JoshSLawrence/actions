# Nightly drift detection: an issue (labelled `drift`) per drifted
# deployment, closed once the drift is gone. Use the same search-root as the
# deploy workflow.

name: OpenTofu drift

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  drift:
    uses: JoshSLawrence/actions/.github/workflows/opentofu-drift.yaml@v0.2.0
    permissions:
      contents: read
      id-token: write
      issues: write
    with:
      search-root: iac
