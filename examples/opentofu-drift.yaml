# Nightly drift detection for every root module and deployment in the
# repository -- the same search-root and deployments as the deploy
# workflow. A drifted deployment gets an issue (labelled `drift`), updated
# by later checks and closed once the drift is gone.

name: OpenTofu drift

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  drift:
    uses: JoshSLawrence/actions/.github/workflows/opentofu-drift.yaml@v1
    permissions:
      contents: read
      id-token: write
      issues: write
    with:
      search-root: iac
      deployments: deployments/*.tfvars
      backend-config: |
        resource_group_name=rg-tfstate
        storage_account_name=sttfstate
        container_name=tfstate
      # Read-only identity: the plan environment's AZURE_CLIENT_ID variable
      plan-environment: drift
