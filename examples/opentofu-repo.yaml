# A repository with one root module (or several -- the same workflow finds
# them all), applied from the PR.
#
# Setup:
# - infra/mise.toml pins opentofu, tflint and trivy (the default checks
#   need all three): 'mise use opentofu tflint trivy' in infra/.
# - Environment `production`, with required reviewers if your plan allows.
# - Variables AZURE_CLIENT_ID, AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID, and
#   federated credentials for this repository's `pull_request`,
#   `ref:refs/heads/main` and `environment:production` subjects (see
#   Setup in opentofu/README.md for the subject format).

name: OpenTofu

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  opentofu:
    uses: JoshSLawrence/actions/.github/workflows/opentofu.yaml@v1
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: write
    with:
      search-root: infra
      apply-environment: production
