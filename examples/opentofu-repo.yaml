# A repository with one root module (or several -- the same workflow finds
# them all), applied from the PR after approval.
#
# Setup (once per repository):
# - infra/mise.toml pins the module's tools: opentofu, plus tflint and
#   trivy for the default checks ('mise use opentofu@1.12.6 tflint trivy'
#   in infra/).
# - Environment `production` with required reviewers (Settings ->
#   Environments). Optionally `production-plan` without reviewers, to scope
#   a read-only identity to plans.
# - Variables AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   (repository-wide, or per environment for separate plan/apply
#   identities), and federated credentials for this repository's
#   `environment:production` (and `environment:production-plan`) subjects.
# - Require the "opentofu / Result" check in a branch ruleset for main.

name: OpenTofu

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  # Re-apply main, e.g. to roll back a PR that was applied but not merged
  workflow_dispatch:

permissions: {}

jobs:
  opentofu:
    uses: JoshSLawrence/actions/.github/workflows/opentofu.yaml@v1
    # The reusable workflow's jobs can only use what's granted here
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: write
    with:
      search-root: infra
      plan-environment: production-plan
      apply-environment: production
      # Checks are on/off switches
      docs: true
      trivy-severity: CRITICAL,HIGH
