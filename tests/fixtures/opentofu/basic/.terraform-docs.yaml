formatter: markdown table
header-from: .header.md

output:
  file: README.md
  mode: inject
  template: |-
    <!-- BEGIN_TF_DOCS -->
    {{ .Content }}
    <!-- END_TF_DOCS -->

sort:
  enabled: true
  by: name

settings:
  anchor: true
  default: true
  escape: true
  html: true
  lockfile: true
  required: true
  sensitive: true
  type: true
