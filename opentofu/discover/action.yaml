name: OpenTofu discover
description: >-
  Finds the root modules under a directory, at any depth -- directories with
  *.tf files and their own mise.toml -- and selects what a PR or push
  affects: every deployment of a module whose own files (child modules and
  tests included) or shared paths changed, or just the deployments whose
  deployments/<name>.yaml or <name>.tfvars changed. Outputs a matrix of
  modules, and one of every selected deployment. Then fails unless every
  GitHub environment they use already exists: GitHub would otherwise create
  a missing one, unprotected, when a job names it (needs actions read).
  Check out with fetch-depth 0 so changes can be diffed.

inputs:
  search-root:
    description: Directory to search, relative to the workspace. A single root module works too.
    required: false
    default: "."
  exclude:
    description: Globs of module paths to skip, space- or newline-separated (e.g. legacy/**).
    required: false
    default: ""
  modules:
    description: Run exactly these module paths, every deployment, ignoring changes (e.g. from a workflow_dispatch input).
    required: false
    default: ""
  changed-only:
    description: On pull_request and push runs, select only what changed. Other events select everything.
    required: false
    default: "true"
  shared-paths:
    description: >-
      Globs whose change selects everything (e.g. .github/workflows/**),
      space- or newline-separated. Also added to each module's preflight
      paths.
    required: false
    default: ""
  require-environments:
    description: '"true" to fail unless every environment the selected deployments use exists.'
    required: false
    default: "true"
  also-required-environments:
    description: Further environments that must exist, space-separated (e.g. the integration tests').
    required: false
    default: ""
  github-token:
    description: "Token to check the environments exist with (needs actions: read)."
    required: false
    default: ${{ github.token }}

outputs:
  matrix:
    description: '{"module": [{"path", "deployments"}, ...]} for strategy.matrix; deployments is a JSON array string.'
    value: ${{ steps.discover.outputs.matrix }}
  deployments-matrix:
    description: '{"deployment": [...]} -- every selected deployment of every selected module, with its path.'
    value: ${{ steps.discover.outputs.deployments-matrix }}
  environments:
    description: The GitHub environments the selected deployments use, space-separated.
    value: ${{ steps.discover.outputs.environments }}
  modules:
    description: JSON array of the selected module paths.
    value: ${{ steps.discover.outputs.modules }}
  count:
    description: Number of selected modules.
    value: ${{ steps.discover.outputs.count }}
  has-modules:
    description: "'true' if any module is selected."
    value: ${{ steps.discover.outputs.has-modules }}

runs:
  using: composite
  steps:
    - name: Discover root modules
      id: discover
      shell: bash
      run: '"${GITHUB_ACTION_PATH}/../scripts/discover.sh"'
      env:
        SEARCH_ROOT: ${{ inputs.search-root }}
        EXCLUDE: ${{ inputs.exclude }}
        MODULES: ${{ inputs.modules }}
        CHANGED_ONLY: ${{ inputs.changed-only }}
        SHARED_PATHS: ${{ inputs.shared-paths }}
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        BEFORE_SHA: ${{ github.event.before }}

    - name: Check the environments exist
      if: inputs.require-environments == 'true'
      shell: bash
      run: '"${GITHUB_ACTION_PATH}/../../shared/scripts/require-environments.sh"'
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        ENVIRONMENTS: ${{ steps.discover.outputs.environments }} ${{ inputs.also-required-environments }}
