name: OpenTofu setup
description: >-
  Installs mise, then runs mise install in the root module: exactly the tools
  the module's own mise config pins (its mise.toml), nothing from parent
  directories such as the repository root. Fails, listing them all, if a
  tool the job needs isn't pinned. Optionally exports secret KEY=VALUE env
  vars for the rest of the job.

inputs:
  working-directory:
    description: Root module directory, relative to the workspace.
    required: false
    default: "."
  required-tools:
    description: >-
      mise tools the job needs, space- or newline-separated (opentofu, tflint,
      trivy, terraform-docs, conftest, infracost, ...). They must be pinned in
      the module's mise config; this only checks, it never adds tools.
    required: false
    default: opentofu
  mise-version:
    description: >-
      mise version to install (default: 2026.9.12). Pinned rather than latest
      so a mise release can't change behaviour under you; bump it
      deliberately.
    required: false
    default: ""
  github-token:
    description: Token for GitHub API calls while installing tools (avoids rate limits).
    required: false
    default: ${{ github.token }}
  env-vars:
    description: >-
      KEY=VALUE lines (usually from a secret) to export as environment
      variables for the rest of the job, masked in the log. Blank lines and
      lines starting with # are skipped.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Only installs mise itself: tools are installed next, scoped to the
    # module. mise-action also trusts every mise config under the workspace
    # (MISE_TRUSTED_CONFIG_PATHS). Its env/PATH export is off because it would
    # read configs above the module; the scripts run tools with `mise exec`,
    # which applies the module's [env].
    - name: Install mise
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        # The default lives here rather than on the input, so callers passing
        # an empty string through (like the reusable workflow) get it too.
        # Dependabot doesn't update it; bump it by hand now and then.
        version: ${{ inputs.mise-version || '2026.9.12' }}
        working_directory: ${{ inputs.working-directory }}
        install: false
        env: false
        export_path: false
        github_token: ${{ inputs.github-token }}

    - name: Install the module's tools
      shell: bash
      run: '"${GITHUB_ACTION_PATH}/../scripts/mise-install.sh"'
      env:
        WORKING_DIR: ${{ inputs.working-directory }}
        REQUIRED_TOOLS: ${{ inputs.required-tools }}
        MISE_GITHUB_TOKEN: ${{ inputs.github-token }}

    - name: Export environment variables
      if: inputs.env-vars != ''
      shell: bash
      run: '"${GITHUB_ACTION_PATH}/../scripts/export-env.sh"'
      env:
        ENV_VARS: ${{ inputs.env-vars }}
