name: OpenTofu drift report
description: >-
  Reports a drift check (a plan of the default branch) for one deployment:
  opens or updates an issue while there's drift, comments on and closes it
  once there isn't, and optionally fails the job on drift. Run it after
  opentofu/plan. Needs issues: write when create-issues is on.

inputs:
  has-changes:
    description: The has-changes output of opentofu/plan.
    required: true
  key:
    description: The key output of opentofu/plan (one issue per key).
    required: true
  title:
    description: What drifted, for the issue title (e.g. the plan action's title).
    required: false
    default: ""
  summary-file:
    description: The summary-file output of opentofu/plan.
    required: false
    default: ""
  create-issues:
    description: Open, update and close drift issues.
    required: false
    default: "true"
  labels:
    description: Labels for drift issues, comma-separated. The first one finds existing issues.
    required: false
    default: drift
  fail-on-drift:
    description: Fail the job when there's drift.
    required: false
    default: "false"
  issue-author:
    description: >-
      Login that posts the issues; only its issues are updated. Change it
      when github-token is a GitHub App token (e.g. my-app[bot]).
    required: false
    default: github-actions[bot]
  github-token:
    description: 'Token for the issues (issues: write).'
    required: false
    default: ${{ github.token }}

outputs:
  issue:
    description: Number of the deployment's open drift issue, if any.
    value: ${{ steps.report.outputs.issue }}

runs:
  using: composite
  steps:
    - name: Report drift
      id: report
      shell: bash
      run: '"${GITHUB_ACTION_PATH}/../scripts/drift-report.sh"'
      env:
        HAS_CHANGES: ${{ inputs.has-changes }}
        KEY: ${{ inputs.key }}
        TITLE: ${{ inputs.title }}
        SUMMARY_FILE: ${{ inputs.summary-file }}
        CREATE_ISSUES: ${{ inputs.create-issues }}
        LABELS: ${{ inputs.labels }}
        FAIL_ON_DRIFT: ${{ inputs.fail-on-drift }}
        ISSUE_AUTHOR: ${{ inputs.issue-author }}
        GH_TOKEN: ${{ inputs.github-token }}
