name: OpenTofu deployments
description: >-
  Resolves a root module's deployments -- one per .tfvars file matching
  `deployments`, or the module on its own -- into a matrix, each with its var
  files, backend config (plus a same-named .tfbackend file), environments and
  preflight paths.

inputs:
  working-directory:
    description: Root module directory, relative to the workspace.
    required: false
    default: "."
  deployments:
    description: .tfvars globs/paths relative to the module, one deployment each (e.g. deployments/*.tfvars). Must match something if set.
    required: false
    default: ""
  var-files:
    description: Var files every deployment uses, before its own.
    required: false
    default: ""
  backend-config:
    description: Backend config every deployment uses, one per line; {deployment} is replaced.
    required: false
    default: ""
  plan-environment:
    description: Plan environment name; {deployment} is replaced.
    required: false
    default: ""
  apply-environment:
    description: Apply environment name; {deployment} is replaced.
    required: false
    default: ""
  preflight-paths:
    description: "Paths every deployment's plan depends on (default: the working directory)."
    required: false
    default: ""

outputs:
  matrix:
    description: '{"deployment": [{"name", "var_files", "backend_config", "plan_environment", "apply_environment", "preflight_paths"}, ...]}'
    value: ${{ steps.deployments.outputs.matrix }}
  deployments:
    description: JSON array of the deployment names ("" for the module on its own).
    value: ${{ steps.deployments.outputs.deployments }}
  count:
    description: Number of deployments.
    value: ${{ steps.deployments.outputs.count }}

runs:
  using: composite
  steps:
    - name: Resolve deployments
      id: deployments
      shell: bash
      run: '"${GITHUB_ACTION_PATH}/../scripts/deployments.sh"'
      env:
        WORKING_DIR: ${{ inputs.working-directory }}
        DEPLOYMENTS: ${{ inputs.deployments }}
        VAR_FILES: ${{ inputs.var-files }}
        BACKEND_CONFIG: ${{ inputs.backend-config }}
        PLAN_ENVIRONMENT: ${{ inputs.plan-environment }}
        APPLY_ENVIRONMENT: ${{ inputs.apply-environment }}
        PREFLIGHT_PATHS: ${{ inputs.preflight-paths }}
