name: OpenTofu plan
description: >-
  Plans one deployment of a root module to a saved plan file and renders a
  markdown summary (counts, destroys called out, resources, full plan),
  optionally with an Infracost estimate and a conftest policy check. Fails if
  the plan or the policy check fails -- after writing the summary, so it can
  still be posted. Upload plan-dir as an artifact only when this succeeds and
  has-changes is true. Run shared/setup first.

inputs:
  working-directory:
    description: Root module directory, relative to the workspace.
    required: false
    default: "."
  deployment:
    description: The call's name (the workflow's name input, or its last var file's name), for the names and title.
    required: false
    default: ""
  var-files:
    description: >-
      -var-file paths relative to the working directory, space- or
      newline-separated: the deployment's deployments/<name>.tfvars, which
      can also set its backend's variables. Pass the same to opentofu/apply.
    required: false
    default: ""
  plan-dir:
    description: >-
      Directory for tfplan and summary.md -- the plan artifact (default:
      $RUNNER_TEMP/tofu-plan).
    required: false
    default: ""
  environment:
    description: >-
      Environment the plan will be applied in, if any. Part of the names, so
      each module/deployment/environment gets its own comment and artifact.
    required: false
    default: ""
  policy:
    description: Evaluate the plan with conftest; a failing policy fails this action and deletes the plan.
    required: false
    default: "false"
  policy-path:
    description: Policy directories, relative to the workspace, space- or newline-separated.
    required: false
    default: policy
  policy-source:
    description: >-
      go-getter URL to pull policies from, in addition to policy-path, e.g.
      git::https://github.com/org/policies.git//policy?ref=v1
    required: false
    default: ""
  policy-namespaces:
    description: "Rego namespaces to evaluate, space- or newline-separated (default: all)."
    required: false
    default: ""
  policy-fail-on-warn:
    description: Also fail the policy check on warn rules.
    required: false
    default: "false"
  cost-estimate:
    description: >-
      "true" adds an Infracost monthly cost estimate to the summary
      (informational); "false" says in the summary that it's off; empty
      leaves cost out of the summary entirely (e.g. drift checks).
    required: false
    default: ""
  infracost-api-key:
    description: Infracost API key (required for cost-estimate).
    required: false
    default: ""
  checks-results:
    description: >-
      The checks job's results output, or "off", to add a Checks section to
      the summary (empty: no section).
    required: false
    default: ""
  github-token:
    description: Default token for fetching private GitHub module sources.
    required: false
    default: ${{ github.token }}
  modules-token:
    description: >-
      Token that can read private GitHub repositories used as module (and
      policy-source) sources. Defaults to github-token.
    required: false
    default: ""

outputs:
  key:
    description: Unique key for this module/deployment/environment -- the comment-key for shared/pr-comment.
    value: ${{ steps.names.outputs.key }}
  artifact-name:
    description: Plan artifact name derived from key.
    value: ${{ steps.names.outputs.artifact-name }}
  title:
    description: Heading for the PR comment.
    value: ${{ steps.names.outputs.title }}
  has-changes:
    description: "'true' if applying the plan would change anything."
    value: ${{ steps.plan.outputs.has-changes }}
  plan-sha256:
    description: SHA-256 of tfplan (when has-changes); pass it to opentofu/apply.
    value: ${{ steps.plan.outputs.plan-sha256 }}
  plan-dir:
    description: Absolute path of the directory holding tfplan and summary.md.
    value: ${{ steps.plan.outputs.plan-dir }}
  summary-file:
    description: Absolute path of the markdown plan summary (empty if none was produced).
    value: ${{ steps.finish.outputs.summary-file }}
  exit-code:
    description: Exit code of tofu init/plan (0 = no changes, 2 = changes, else failed).
    value: ${{ steps.plan.outputs.exit-code }}
  policy-passed:
    description: "'true'/'false' when the policy check ran, otherwise empty."
    value: ${{ steps.policy.outputs.passed }}

runs:
  using: composite
  steps:
    - name: Resolve names
      id: names
      shell: bash
      run: '"${GITHUB_ACTION_PATH}/../scripts/names.sh"'
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        DEPLOYMENT: ${{ inputs.deployment }}
        APPLY_ENVIRONMENT: ${{ inputs.environment }}
        REPOSITORY_NAME: ${{ github.event.repository.name }}

    - name: Plan
      id: plan
      shell: bash
      run: '"${GITHUB_ACTION_PATH}/../scripts/plan.sh"'
      env:
        WORKING_DIR: ${{ inputs.working-directory }}
        PLAN_DIR: ${{ inputs.plan-dir || format('{0}/tofu-plan', runner.temp) }}
        WORK_DIR: ${{ runner.temp }}/tofu-plan-work
        VAR_FILES: ${{ inputs.var-files }}
        MODULES_GITHUB_TOKEN: ${{ inputs.modules-token || inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        TARGET_BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
        TARGET_SHA: ${{ github.event.pull_request.base.sha || github.sha }}

    # Before the policy check, so the estimate is in the summary even when
    # the policy blocks the plan. Only plans with changes have a cost to
    # estimate (or to say isn't estimated).
    - name: Cost estimate
      if: inputs.cost-estimate != '' && steps.plan.outputs.has-changes == 'true'
      shell: bash
      run: '"${GITHUB_ACTION_PATH}/../scripts/cost-estimate.sh"'
      env:
        COST_ESTIMATE: ${{ inputs.cost-estimate }}
        WORKING_DIR: ${{ inputs.working-directory }}
        PLAN_JSON: ${{ steps.plan.outputs.work-dir }}/plan.json
        FRAGMENT_FILE: ${{ steps.plan.outputs.work-dir }}/fragments/20-cost.md
        INFRACOST_API_KEY: ${{ inputs.infracost-api-key }}

    - name: Policy check
      id: policy
      if: inputs.policy == 'true' && steps.plan.outputs.has-changes == 'true'
      shell: bash
      run: '"${GITHUB_ACTION_PATH}/../scripts/policy-check.sh"'
      env:
        WORKING_DIR: ${{ inputs.working-directory }}
        PLAN_JSON: ${{ steps.plan.outputs.work-dir }}/plan.json
        PLAN_DIR: ${{ steps.plan.outputs.plan-dir }}
        FRAGMENT_FILE: ${{ steps.plan.outputs.work-dir }}/fragments/30-policy.md
        WORK_DIR: ${{ steps.plan.outputs.work-dir }}
        POLICY_PATH: ${{ inputs.policy-path }}
        POLICY_SOURCE: ${{ inputs.policy-source }}
        POLICY_NAMESPACES: ${{ inputs.policy-namespaces }}
        POLICY_FAIL_ON_WARN: ${{ inputs.policy-fail-on-warn }}
        MODULES_GITHUB_TOKEN: ${{ inputs.modules-token || inputs.github-token }}

    - name: Checks summary
      if: ${{ !cancelled() && inputs.checks-results != '' && steps.plan.outputs.work-dir != '' }}
      shell: bash
      run: '"${GITHUB_ACTION_PATH}/../scripts/checks-summary.sh"'
      env:
        RESULTS: ${{ inputs.checks-results }}
        FRAGMENT_FILE: ${{ steps.plan.outputs.work-dir }}/fragments/40-checks.md

    # Always: after a failed plan or policy check too, so the failure can be
    # posted, and so the scratch files (sensitive) are always deleted
    - name: Finish
      id: finish
      if: always() && steps.plan.outputs.work-dir != ''
      shell: bash
      run: '"${GITHUB_ACTION_PATH}/../scripts/plan-finish.sh"'
      env:
        WORK_DIR: ${{ steps.plan.outputs.work-dir }}
        SUMMARY_FILE: ${{ steps.plan.outputs.plan-dir }}/summary.md
        TITLE: ${{ steps.names.outputs.title }}
