name: OpenTofu apply
description: >-
  Applies a saved plan from opentofu/plan -- exactly that plan, never a fresh
  one. First refuses a stale plan (the PR moved on, or the module changed on
  the target branch since it was planned), then checks the plan file's digest
  and applies it. Download the plan artifact into plan-dir and run
  opentofu/setup first. Gate the job with an environment that requires
  reviewers.

inputs:
  working-directory:
    description: Root module directory, relative to the workspace.
    required: false
    default: "."
  plan-dir:
    description: 'Directory the plan artifact was downloaded to (default: $RUNNER_TEMP/tofu-plan).'
    required: false
    default: ""
  plan-sha256:
    description: The plan-sha256 output of opentofu/plan.
    required: true
  environment:
    description: >-
      The job's GitHub environment. Only used to warn when it has no required
      reviewers (GitHub silently creates unprotected environments on first
      use), which needs actions: read.
    required: false
    default: ""
  backend-config:
    description: The same backend-config the plan used.
    required: false
    default: ""
  preflight:
    description: Refuse plans that are stale (see description). Only disable if something else guarantees it.
    required: false
    default: "true"
  preflight-paths:
    description: >-
      Repository paths the plan depends on, space- or newline-separated: a
      change to any of them on the target branch since the plan makes it
      stale. Default: the working directory. Add local modules outside it.
    required: false
    default: ""
  github-token:
    description: Token for the preflight's GitHub API calls, and the default for module sources.
    required: false
    default: ${{ github.token }}
  modules-token:
    description: Token that can read private GitHub repositories used as module sources.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Check the environment gates the apply
      shell: bash
      run: '"${GITHUB_ACTION_PATH}/../../shared/scripts/check-environment.sh"'
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        APPLY_ENVIRONMENT: ${{ inputs.environment }}

    - name: Check the plan is still current
      if: inputs.preflight == 'true'
      shell: bash
      run: '"${GITHUB_ACTION_PATH}/../../shared/scripts/apply-preflight.sh"'
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PREFLIGHT_PATHS: ${{ inputs.preflight-paths || inputs.working-directory }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        TARGET_BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
        TARGET_SHA: ${{ github.event.pull_request.base.sha || github.sha }}

    - name: Apply
      shell: bash
      run: '"${GITHUB_ACTION_PATH}/../scripts/apply.sh"'
      env:
        WORKING_DIR: ${{ inputs.working-directory }}
        PLAN_DIR: ${{ inputs.plan-dir || format('{0}/tofu-plan', runner.temp) }}
        PLAN_SHA256: ${{ inputs.plan-sha256 }}
        BACKEND_CONFIG: ${{ inputs.backend-config }}
        MODULES_GITHUB_TOKEN: ${{ inputs.modules-token || inputs.github-token }}
