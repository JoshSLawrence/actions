name: Data Factory build
description: >-
  Validates a Data Factory Git folder and exports its ARM template -- what
  "Validate all" and "Publish" do in the Data Factory UI, without the UI or an
  adf_publish branch. Runs offline (no Azure credentials), so it's safe on PRs
  from forks. Upload template-dir as an artifact for datafactory/plan. Run
  shared/setup first, with node pinned in the folder's mise.toml.

inputs:
  working-directory:
    description: The factory's Git root folder (pipeline/, dataset/, ...), relative to the workspace.
    required: false
    default: "."
  stack-name:
    description: "Display name, and the template artifact's name (default: the working directory)."
    required: false
    default: ""
  factory-name:
    description: >-
      The development factory's name, the default of the template's
      factoryName parameter (default: the name in factory/*.json). Every
      deployment sets its own.
    required: false
    default: ""
  output-dir:
    description: "Where the template goes (default: $RUNNER_TEMP/datafactory-template)."
    required: false
    default: ""

outputs:
  template-dir:
    description: Absolute path of the exported template (ARMTemplateForFactory.json, ...).
    value: ${{ steps.build.outputs.template-dir }}
  artifact-name:
    description: Name to upload template-dir under, unique per folder.
    value: ${{ steps.names.outputs.template-artifact-name }}
  resource-count:
    description: Resources in the template.
    value: ${{ steps.build.outputs.resource-count }}
  bundle-sha256:
    description: SHA-256 of the export bundle that ran (Microsoft doesn't version it).
    value: ${{ steps.build.outputs.bundle-sha256 }}

runs:
  using: composite
  steps:
    - name: Resolve names
      id: names
      shell: bash
      run: '"${GITHUB_ACTION_PATH}/../../arm/scripts/arm-names.sh"'
      env:
        SERVICE: datafactory
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        STACK_NAME: ${{ inputs.stack-name }}
        REPOSITORY_NAME: ${{ github.event.repository.name }}

    - name: Validate and export
      id: build
      shell: bash
      run: '"${GITHUB_ACTION_PATH}/../scripts/build.sh"'
      env:
        WORKING_DIR: ${{ inputs.working-directory }}
        FACTORY_NAME: ${{ inputs.factory-name }}
        OUTPUT_DIR: ${{ inputs.output-dir || format('{0}/datafactory-template', runner.temp) }}
        WORK_DIR: ${{ runner.temp }}/datafactory-build
