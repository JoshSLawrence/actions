name: Data Factory plan
description: >-
  Plans one deployment of an exported Data Factory template: renders its
  parameters (every name checked against the template), optionally previews
  it with az deployment group what-if and lists what the post-deployment
  script would delete, and writes a markdown summary. Fails after writing the
  summary, so it can still be posted. Upload plan-dir as an artifact for
  datafactory/apply when has-changes is true. With what-if, sign in with
  azure/login and run opentofu/setup (azure-cli pinned) first.

inputs:
  working-directory:
    description: The factory's Git root folder, relative to the workspace.
    required: false
    default: "."
  template-dir:
    description: The exported template (datafactory/build's template-dir, or its downloaded artifact).
    required: true
  deployment:
    description: Deployment name (its parameters file's), for the names and title. Empty for the template on its own.
    required: false
    default: ""
  parameter-files:
    description: ARM parameters files relative to the working directory, in order, space- or newline-separated.
    required: false
    default: ""
  parameters:
    description: >-
      Parameter values, one name=value per line, after the files. Values of
      int, bool, object and array parameters are JSON.
    required: false
    default: ""
  parameter-secrets:
    description: name=value lines for secure parameters, used for the what-if only; never written to the plan.
    required: false
    default: ""
  resource-group:
    description: Resource group of the target factory.
    required: true
  what-if:
    description: Preview against the live factory (needs az signed in, with rights to run what-if).
    required: false
    default: "false"
  pre-post-script:
    description: Whether the apply runs the pre/post-deployment script (which deletes resources removed from the folder); the preview then lists them.
    required: false
    default: "true"
  plan-dir:
    description: "Directory for the plan (default: $RUNNER_TEMP/datafactory-plan) -- the plan artifact."
    required: false
    default: ""
  stack-name:
    description: "Display name for the summary, comment and artifact names (default: the working directory)."
    required: false
    default: ""
  environment:
    description: >-
      Environment the plan will be applied in, if any. Part of the names, so
      each folder/deployment/environment gets its own comment and artifact.
    required: false
    default: ""

outputs:
  key:
    description: Unique key for this folder/deployment/environment -- the comment-key for opentofu/pr-comment.
    value: ${{ steps.names.outputs.key }}
  artifact-name:
    description: Plan artifact name derived from key.
    value: ${{ steps.names.outputs.artifact-name }}
  title:
    description: Heading for the PR comment.
    value: ${{ steps.names.outputs.title }}
  has-changes:
    description: "'true' unless the what-if found nothing to change or delete (always 'true' without what-if)."
    value: ${{ steps.plan.outputs.has-changes }}
  plan-sha256:
    description: SHA-256 of the plan; pass it to datafactory/apply.
    value: ${{ steps.plan.outputs.plan-sha256 }}
  plan-dir:
    description: Absolute path of the plan directory.
    value: ${{ steps.plan.outputs.plan-dir }}
  summary-file:
    description: Absolute path of the markdown plan summary (written on failure too).
    value: ${{ steps.plan.outputs.summary-file }}
  factory-name:
    description: The target factory.
    value: ${{ steps.plan.outputs.factory-name }}

runs:
  using: composite
  steps:
    - name: Resolve names
      id: names
      shell: bash
      run: '"${GITHUB_ACTION_PATH}/../../shared/scripts/arm-names.sh"'
      env:
        SERVICE: datafactory
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        STACK_NAME: ${{ inputs.stack-name }}
        DEPLOYMENT: ${{ inputs.deployment }}
        APPLY_ENVIRONMENT: ${{ inputs.environment }}
        REPOSITORY_NAME: ${{ github.event.repository.name }}

    - name: Plan
      id: plan
      shell: bash
      run: '"${GITHUB_ACTION_PATH}/../scripts/plan.sh"'
      env:
        WORKING_DIR: ${{ inputs.working-directory }}
        TEMPLATE_DIR: ${{ inputs.template-dir }}
        PLAN_DIR: ${{ inputs.plan-dir || format('{0}/datafactory-plan', runner.temp) }}
        WORK_DIR: ${{ runner.temp }}/datafactory-plan-work
        DEPLOYMENT: ${{ inputs.deployment }}
        PARAMETER_FILES: ${{ inputs.parameter-files }}
        PARAMETERS: ${{ inputs.parameters }}
        PARAMETER_SECRETS: ${{ inputs.parameter-secrets }}
        RESOURCE_GROUP: ${{ inputs.resource-group }}
        WHAT_IF: ${{ inputs.what-if }}
        PRE_POST_SCRIPT: ${{ inputs.pre-post-script }}
        TITLE: ${{ steps.names.outputs.title }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        TARGET_BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
        TARGET_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
