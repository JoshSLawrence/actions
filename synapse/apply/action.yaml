name: Synapse apply
description: >-
  Deploys a plan from synapse/plan -- exactly that plan, to the workspace and
  resource group it names. First refuses a stale plan (the PR moved on, or the
  folder changed on the target branch since it was planned) and checks the
  plan's digest and that the workspace is as it was when planned; then stops
  started triggers, publishes the artifacts with the Synapse deployer
  (JoshSLawrence/synapse-deploy, signed in with the job's GitHub OIDC
  token), and starts triggers again. Download the plan artifact into
  plan-dir, sign in with azure/login, and run shared/setup (azure-cli pinned)
  first, on a runner that can reach the workspace. Needs id-token: write.
  Gate the job with an environment that requires reviewers.

inputs:
  working-directory:
    description: The Synapse workspace's Git root folder, relative to the GitHub workspace.
    required: false
    default: "."
  plan-dir:
    description: 'Directory the plan artifact was downloaded to (default: $RUNNER_TEMP/synapse-plan).'
    required: false
    default: ""
  plan-sha256:
    description: The plan-sha256 output of synapse/plan.
    required: true
  parameter-secrets:
    description: name=value lines for secure parameters.
    required: false
    default: ""
  delete-artifacts:
    description: Delete artifacts in the workspace that aren't in the template.
    required: false
    default: "true"
  deploy-managed-private-endpoints:
    description: >-
      Deploy the folder's managed private endpoints. "false" leaves them to
      infrastructure as code: they're left out of the deployment and never
      deleted. With "true", Synapse also deletes endpoints that aren't in the
      folder (the deployer's identity then needs Synapse Linked Data Manager,
      or Synapse Administrator). Must be what the plan was made with.
    required: false
    default: "false"
  manage-triggers:
    description: Stop started triggers before the deployment, and start them (and those the template marks Started) after.
    required: false
    default: "true"
  azure-client-id:
    description: "Client ID of the deploying identity, for the deployer's OIDC sign-in (default: $ARM_CLIENT_ID)."
    required: false
    default: ""
  azure-tenant-id:
    description: "Tenant ID (default: $ARM_TENANT_ID)."
    required: false
    default: ""
  azure-subscription-id:
    description: "Subscription of the workspace (default: $ARM_SUBSCRIPTION_ID)."
    required: false
    default: ""
  environment:
    description: >-
      The job's GitHub environment. Only used to warn when it has no required
      reviewers (GitHub silently creates unprotected environments on first
      use), which needs actions: read.
    required: false
    default: ""
  preflight:
    description: Refuse plans that are stale (see description). Only disable if something else guarantees it.
    required: false
    default: "true"
  preflight-paths:
    description: >-
      Repository paths the plan depends on, space- or newline-separated: a
      change to any of them on the target branch since the plan makes it
      stale. Default: the working directory. Add parameter files outside it.
    required: false
    default: ""
  github-token:
    description: Token for the preflight's GitHub API calls.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Check the environment gates the apply
      shell: bash
      run: '"${GITHUB_ACTION_PATH}/../../shared/scripts/check-environment.sh"'
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        APPLY_ENVIRONMENT: ${{ inputs.environment }}

    - name: Check the plan is still current
      if: inputs.preflight == 'true'
      shell: bash
      run: '"${GITHUB_ACTION_PATH}/../../shared/scripts/apply-preflight.sh"'
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PREFLIGHT_PATHS: ${{ inputs.preflight-paths || inputs.working-directory }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        TARGET_BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
        TARGET_SHA: ${{ github.event.pull_request.base.sha || github.sha }}

    - name: Prepare
      id: prepare
      shell: bash
      run: '"${GITHUB_ACTION_PATH}/../scripts/apply-prepare.sh"'
      env:
        WORKING_DIR: ${{ inputs.working-directory }}
        PLAN_DIR: ${{ inputs.plan-dir || format('{0}/synapse-plan', runner.temp) }}
        PLAN_SHA256: ${{ inputs.plan-sha256 }}
        PARAMETER_SECRETS: ${{ inputs.parameter-secrets }}
        MANAGE_TRIGGERS: ${{ inputs.manage-triggers }}
        DEPLOY_MANAGED_PRIVATE_ENDPOINTS: ${{ inputs.deploy-managed-private-endpoints }}
        DELETE_ARTIFACTS: ${{ inputs.delete-artifacts }}
        STATE_DIR: ${{ runner.temp }}/synapse-apply

    # The deployer is a standalone action with its own releases
    # (JoshSLawrence/synapse-deploy), signed in with GitHub OIDC; Dependabot
    # bumps this pin like any other action.
    - name: Deploy artifacts
      id: deploy
      uses: JoshSLawrence/synapse-deploy@5ef505d3b08a71c3e15edce63db7c3bf8aa7af1d # v1.0.0
      with:
        workspace-name: ${{ steps.prepare.outputs.workspace-name }}
        template-file: ${{ steps.prepare.outputs.template-file }}
        parameters-file: ${{ steps.prepare.outputs.parameters-file }}
        resource-group: ${{ steps.prepare.outputs.resource-group }}
        subscription-id: ${{ inputs.azure-subscription-id || env.ARM_SUBSCRIPTION_ID }}
        client-id: ${{ inputs.azure-client-id || env.ARM_CLIENT_ID }}
        tenant-id: ${{ inputs.azure-tenant-id || env.ARM_TENANT_ID }}
        delete-artifacts: ${{ steps.prepare.outputs.delete-artifacts }}
        deploy-managed-private-endpoints: ${{ steps.prepare.outputs.deploy-managed-private-endpoints }}

    # Always, once prepare has written the parameters file: it holds the
    # secrets, and triggers stopped before a failed deployment must restart
    - name: Finish
      if: always() && steps.prepare.outputs.state-dir != ''
      shell: bash
      run: '"${GITHUB_ACTION_PATH}/../scripts/apply-finish.sh"'
      env:
        WORKING_DIR: ${{ inputs.working-directory }}
        STATE_DIR: ${{ steps.prepare.outputs.state-dir }}
        TEMPLATE_FILE: ${{ steps.prepare.outputs.template-file }}
        WORKSPACE_NAME: ${{ steps.prepare.outputs.workspace-name }}
        DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        MANAGE_TRIGGERS: ${{ inputs.manage-triggers }}
