name: Synapse plan
description: >-
  Plans one deployment of an exported Synapse workspace template: leaves out
  what infrastructure as code owns (the managed virtual network, pools, and
  unless deployed the managed private endpoints and integration runtimes),
  renders its parameters (every name checked against the template), optionally
  compares it with the live workspace (each artifact, as the deployer would
  publish it, against its live definition; new artifacts, those the
  deployment deletes, that the pools its artifacts use exist, and the
  workspace's fingerprint for the apply to check), and writes a markdown
  summary. Fails after writing the summary, so it can still be posted. Upload
  plan-dir as an artifact for synapse/apply when has-changes is true; a
  deployment with nothing to change has has-changes false. With what-if, sign in with azure/login and run
  shared/setup (azure-cli pinned) first, on a runner that can reach the
  workspace.

inputs:
  working-directory:
    description: The Synapse workspace's Git root folder, relative to the GitHub workspace.
    required: false
    default: "."
  template-dir:
    description: The exported template (synapse/build's template-dir, or its downloaded artifact).
    required: true
  deployment:
    description: Deployment name (its parameters file's), for the names and title. Empty for the template on its own.
    required: false
    default: ""
  parameter-files:
    description: ARM parameters files relative to the working directory, in order, space- or newline-separated.
    required: false
    default: ""
  parameters:
    description: >-
      Parameter values, one name=value per line, after the files. Values of
      int, bool, object and array parameters are JSON.
    required: false
    default: ""
  parameter-secrets:
    description: >-
      name=value lines for secure parameters. With what-if, their values are
      compared with the live ones; they are never shown or saved.
    required: false
    default: ""
  resource-group:
    description: Resource group of the target workspace.
    required: true
  what-if:
    description: >-
      Compare each artifact with its live definition (needs az signed in,
      network access to the workspace, and Synapse Artifact User). Without it
      the plan can't tell what changes and has-changes is true.
    required: false
    default: "false"
  always-apply:
    description: >-
      Make has-changes true even when the comparison found nothing to change
      (to push a rotated parameter-secret, or to deploy again after a change
      in the portal that the plan can't see).
    required: false
    default: "false"
  delete-artifacts:
    description: Whether the apply deletes artifacts that aren't in the template; the comparison then lists them.
    required: false
    default: "true"
  deploy-managed-private-endpoints:
    description: >-
      Deploy the folder's managed private endpoints. "false" leaves them to
      infrastructure as code: they're left out of the deployment and never
      deleted. With "true", Synapse also deletes endpoints that aren't in the
      folder.
    required: false
    default: "false"
  deploy-integration-runtimes:
    description: >-
      Deploy the folder's integration runtimes. "false" leaves them to
      infrastructure as code: they're left out of the deployment and never
      deleted. With "true", Synapse never deletes them.
    required: false
    default: "false"
  plan-dir:
    description: "Directory for the plan (default: $RUNNER_TEMP/synapse-plan) -- the plan artifact."
    required: false
    default: ""
  stack-name:
    description: "Display name for the summary, comment and artifact names (default: the working directory)."
    required: false
    default: ""
  environment:
    description: >-
      Environment the plan will be applied in, if any. Part of the names, so
      each folder/deployment/environment gets its own comment and artifact.
    required: false
    default: ""

outputs:
  key:
    description: Unique key for this folder/deployment/environment -- the comment-key for shared/pr-comment.
    value: ${{ steps.names.outputs.key }}
  artifact-name:
    description: Plan artifact name derived from key.
    value: ${{ steps.names.outputs.artifact-name }}
  title:
    description: Heading for the PR comment.
    value: ${{ steps.names.outputs.title }}
  has-changes:
    description: >-
      'false' when what-if found nothing to create, change or delete (and
      always-apply is off); 'true' otherwise, and always without what-if. An
      artifact the plan can't compare counts as a change.
    value: ${{ steps.plan.outputs.has-changes }}
  plan-sha256:
    description: SHA-256 of the plan; pass it to synapse/apply.
    value: ${{ steps.plan.outputs.plan-sha256 }}
  plan-dir:
    description: Absolute path of the plan directory.
    value: ${{ steps.plan.outputs.plan-dir }}
  summary-file:
    description: Absolute path of the markdown plan summary (written on failure too).
    value: ${{ steps.plan.outputs.summary-file }}
  workspace-name:
    description: The target workspace.
    value: ${{ steps.plan.outputs.workspace-name }}
  resource-group:
    description: The target's resource group.
    value: ${{ steps.plan.outputs.resource-group }}

runs:
  using: composite
  steps:
    - name: Resolve names
      id: names
      shell: bash
      run: '"${GITHUB_ACTION_PATH}/../../arm/scripts/arm-names.sh"'
      env:
        SERVICE: synapse
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        STACK_NAME: ${{ inputs.stack-name }}
        DEPLOYMENT: ${{ inputs.deployment }}
        APPLY_ENVIRONMENT: ${{ inputs.environment }}
        REPOSITORY_NAME: ${{ github.event.repository.name }}

    - name: Plan
      id: plan
      shell: bash
      run: '"${GITHUB_ACTION_PATH}/../scripts/plan.sh"'
      env:
        WORKING_DIR: ${{ inputs.working-directory }}
        TEMPLATE_DIR: ${{ inputs.template-dir }}
        PLAN_DIR: ${{ inputs.plan-dir || format('{0}/synapse-plan', runner.temp) }}
        WORK_DIR: ${{ runner.temp }}/synapse-plan-work
        DEPLOYMENT: ${{ inputs.deployment }}
        PARAMETER_FILES: ${{ inputs.parameter-files }}
        PARAMETERS: ${{ inputs.parameters }}
        PARAMETER_SECRETS: ${{ inputs.parameter-secrets }}
        RESOURCE_GROUP: ${{ inputs.resource-group }}
        WHAT_IF: ${{ inputs.what-if }}
        ALWAYS_APPLY: ${{ inputs.always-apply }}
        DELETE_ARTIFACTS: ${{ inputs.delete-artifacts }}
        DEPLOY_MANAGED_PRIVATE_ENDPOINTS: ${{ inputs.deploy-managed-private-endpoints }}
        DEPLOY_INTEGRATION_RUNTIMES: ${{ inputs.deploy-integration-runtimes }}
        TITLE: ${{ steps.names.outputs.title }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        TARGET_BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
        TARGET_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
