# Keeps the SHA-pinned actions up to date, in the workflows and in every
# composite action (Dependabot only scans the directories listed here).
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /opentofu/*
    schedule:
      interval: weekly
    # Wait before proposing a freshly published release: compromised action
    # releases are usually caught and pulled within days.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"
