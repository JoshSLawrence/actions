# CI for this library: lint everything (including the OpenTofu discovery
# tests), then run the reusable workflows end to end -- from this commit --
# against the test fixtures, the same way a consumer calls them.
#
# The OpenTofu fixtures need no cloud account (random_pet/terraform_data,
# local state), so the e2e runs plan, comment on the PR, and apply in the
# opentofu-fixture and staging environments, which have no reviewers. They
# must exist: the workflow refuses to run in an environment that doesn't
# (GitHub would create it, unprotected), so create them once in Settings ->
# Environments. staging also holds the E2E_PROBE_VAR variable and the
# E2E_PROBE_SECRET secret, and the repository the E2E_REPO_VAR variable,
# which the staging-eu fixture deployment declares. The Data Factory and Synapse fixtures
# build (offline) and plan without what-if, which needs no Azure either.
# One more run deploys the Data Factory fixture to a real, otherwise empty
# factory (adf-githubtest), through the adf-githubtest environment: its
# variables hold the identity, whose only federated credential is for that
# environment. Require "Lint", "E2E repo / Result", "E2E plan only /
# Result", "E2E drift / Result", "E2E datafactory / Result", "E2E synapse /
# Result" and "E2E datafactory (Azure) / Result" in branch protection.

name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-lint-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the tool versions pinned in mise.toml. Dependabot doesn't
      # update `version`; bump it by hand now and then.
      - name: Set up mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: 2026.9.12

      # The same hooks as local commits, so CI and local agree
      - name: pre-commit
        run: .github/scripts/lint.sh
        env:
          # Authenticated tflint plugin downloads avoid GitHub API rate limits
          GITHUB_TOKEN: ${{ github.token }}

  # The entry point, end to end: discovers every fixture root module --
  # basic (deployments dev, prod and staging-eu; staging-eu resolves a
  # variable and a secret from the staging environment and a variable from
  # the repository), minimal (deployed as is through its deployment.yaml)
  # and minimal/nested (a root module inside another) -- with every default
  # check, the shared policy, and apply. changed-only is off so every PR exercises all of them, whatever
  # it changed (tests/opentofu/discover-test.sh covers change detection).
  e2e-repo:
    name: E2E repo
    uses: $/.github/workflows/opentofu.yaml
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: write
    with:
      search-root: tests/fixtures/opentofu
      changed-only: false
      policy: true
      policy-path: tests/fixtures/opentofu/policy

  # The same workflow with toggles flipped: one module picked with modules,
  # the docs check on, other checks off, policies pulled from a URL, and
  # plan only. After e2e-repo, and without PR comments: its plans would
  # otherwise cancel e2e-repo's (same module, deployment and environment)
  # and edit its comments.
  e2e-plan-only:
    name: E2E plan only
    needs: e2e-repo
    if: ${{ !cancelled() }}
    uses: $/.github/workflows/opentofu.yaml
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: write
    with:
      search-root: tests/fixtures/opentofu
      modules: tests/fixtures/opentofu/basic
      docs: true
      tflint: false
      trivy: false
      tests: false
      apply: false
      pr-comment: false
      # The same fixture policy as e2e-repo, but pulled with policy-source
      # (conftest pull) instead of read from policy-path. The PR head, not
      # github.sha: a PR's merge commit can't be cloned by ref.
      policy: true
      policy-path: ""
      policy-source: git::https://github.com/${{ github.repository }}.git//tests/fixtures/opentofu/policy?ref=${{ github.event.pull_request.head.sha || github.sha }}

  # Drift detection over the same deployments. Local state starts empty on
  # every runner, so every check finds "drift": issues are off to keep the
  # repository quiet.
  e2e-drift:
    name: E2E drift
    uses: $/.github/workflows/opentofu-drift.yaml
    permissions:
      contents: read
      id-token: write
      issues: write
    with:
      search-root: tests/fixtures/opentofu
      create-issues: false

  # A factory with two deployments (deployments/dev.json and prod.json):
  # build -- which must leave out the fixture's stray pipeline/.keep -- then
  # plan each and comment on the PR. No what-if and no apply: those need a
  # real factory.
  e2e-datafactory:
    name: E2E datafactory
    uses: $/.github/workflows/datafactory.yaml
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: write
    with:
      working-directory: tests/fixtures/datafactory/basic
      deployments: deployments/*.json
      resource-group: rg-fixture-{deployment}
      what-if: false
      apply: false

  # The same fixture, deployed for real: what-if against the live factory,
  # then the pre-deployment script, the ARM deployment and the
  # post-deployment script, from the PR, without an approval (the
  # environment has no reviewers: it only scopes the credentials). A plan
  # with nothing to change skips the deploy. The fixture's trigger is
  # Stopped, so the factory never runs anything.
  e2e-datafactory-azure:
    name: E2E datafactory (Azure)
    uses: $/.github/workflows/datafactory.yaml
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: write
    with:
      working-directory: tests/fixtures/datafactory/basic
      stack-name: datafactory (adf-githubtest)
      deployments: ci/adf-githubtest.json
      resource-group: rg-dataplatform
      plan-environment: "{deployment}"
      apply-environment: "{deployment}"
      # Dependabot's runs get no OIDC token, so they can't reach Azure: they
      # build and plan offline instead of skipping the job, so the required
      # Result check still reports
      what-if: ${{ github.actor != 'dependabot[bot]' }}
      apply: ${{ github.actor != 'dependabot[bot]' }}

  # The same for a Synapse workspace
  e2e-synapse:
    name: E2E synapse
    uses: $/.github/workflows/synapse.yaml
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: write
    with:
      working-directory: tests/fixtures/synapse/basic
      deployments: deployments/*.json
      resource-group: rg-fixture-{deployment}
      what-if: false
      apply: false
