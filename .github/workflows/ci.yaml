# CI for this library: lint everything (including the OpenTofu script
# tests), then run the reusable workflows end to end -- from this commit --
# against the test fixtures, the same way a consumer calls them.
#
# The OpenTofu fixtures need no cloud account (random_pet/terraform_data,
# local state), so the e2e calls plan, comment on the PR, and apply in the
# opentofu-fixture and staging environments, which have no reviewers. They
# must exist: the workflow refuses to run in an environment that doesn't
# (GitHub would create it, unprotected), so create them once in Settings ->
# Environments. The Data Factory and Synapse fixtures build (offline) and
# plan without what-if, which needs no Azure either. One more run deploys
# the Data Factory fixture to a real, otherwise empty factory
# (adf-githubtest), through the adf-githubtest environment: its variables
# hold the identity, whose only federated credential is for that
# environment. Require "Lint", "E2E OpenTofu", "E2E datafactory / Result",
# "E2E synapse / Result" and "E2E datafactory (Azure) / Result" in branch
# protection.

name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-lint-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the tool versions pinned in mise.toml. Dependabot doesn't
      # update `version`; bump it by hand now and then.
      - name: Set up mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: 2026.9.12

      # The same hooks as local commits, so CI and local agree
      - name: pre-commit
        run: .github/scripts/lint.sh
        env:
          # Authenticated tflint plugin downloads avoid GitHub API rate limits
          GITHUB_TOKEN: ${{ github.token }}

  # OpenTofu, end to end: one call per fixture deployment, the way a
  # consumer calls it, with a per-file check (e2e-opentofu) like the one
  # opentofu/README.md recommends. Most calls turn changed-only off, so every
  # PR exercises them whatever it changed (tests/opentofu/ covers change
  # detection); e2e-tofu-staging keeps it on.

  # Every default check with the call's var file, the shared policy from
  # policy-path, and apply.
  e2e-tofu-dev:
    name: E2E tofu basic-dev
    uses: $/.github/workflows/opentofu.yaml
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: write
    with:
      working-directory: tests/fixtures/opentofu/basic
      var-files: deployments/dev.tfvars
      apply-environment: opentofu-fixture
      changed-only: false
      policy: true
      policy-path: tests/fixtures/opentofu/policy

  # Plan only, with the same policy pulled from a URL (conftest pull)
  # instead. The PR head, not github.sha: a PR's merge commit can't be
  # cloned by ref.
  e2e-tofu-prod:
    name: E2E tofu basic-prod
    uses: $/.github/workflows/opentofu.yaml
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: write
    with:
      working-directory: tests/fixtures/opentofu/basic
      var-files: deployments/prod.tfvars
      apply-environment: opentofu-fixture
      changed-only: false
      apply: false
      policy: true
      policy-path: ""
      policy-source: git::https://github.com/${{ github.repository }}.git//tests/fixtures/opentofu/policy?ref=${{ github.event.pull_request.head.sha || github.sha }}

  # Change detection on: plans and applies only when the fixture, this call
  # or the OpenTofu workflow and its scripts changed. Checks off.
  e2e-tofu-staging:
    name: E2E tofu basic-staging-eu
    uses: $/.github/workflows/opentofu.yaml
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: write
    with:
      working-directory: tests/fixtures/opentofu/basic
      var-files: deployments/staging-eu.tfvars
      apply-environment: staging
      checks: false
      extra-paths: |
        .github/workflows/opentofu.yaml
        opentofu/**
        shared/**

  # A module without var files, providers or a lock file. It doesn't pin
  # terraform-docs, so docs is off.
  e2e-tofu-minimal:
    name: E2E tofu minimal
    uses: $/.github/workflows/opentofu.yaml
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: write
    with:
      working-directory: tests/fixtures/opentofu/minimal
      apply-environment: opentofu-fixture
      changed-only: false
      docs: false

  # The one check for every OpenTofu call above
  e2e-opentofu:
    name: E2E OpenTofu
    needs: [e2e-tofu-dev, e2e-tofu-prod, e2e-tofu-staging, e2e-tofu-minimal]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check results
        uses: $/shared/result
        with:
          needs: ${{ toJSON(needs) }}

  # A factory with two deployments (deployments/dev.json and prod.json):
  # build -- which must leave out the fixture's stray pipeline/.keep -- then
  # plan each and comment on the PR. No what-if and no apply: those need a
  # real factory.
  e2e-datafactory:
    name: E2E datafactory
    uses: $/.github/workflows/datafactory.yaml
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: write
    with:
      working-directory: tests/fixtures/datafactory/basic
      deployments: deployments/*.json
      resource-group: rg-fixture-{deployment}
      what-if: false
      apply: false

  # The same fixture, deployed for real: what-if against the live factory,
  # then the pre-deployment script, the ARM deployment and the
  # post-deployment script, from the PR, without an approval (the
  # environment has no reviewers: it only scopes the credentials). A plan
  # with nothing to change skips the deploy. The fixture's trigger is
  # Stopped, so the factory never runs anything.
  e2e-datafactory-azure:
    name: E2E datafactory (Azure)
    uses: $/.github/workflows/datafactory.yaml
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: write
    with:
      working-directory: tests/fixtures/datafactory/basic
      stack-name: datafactory (adf-githubtest)
      deployments: ci/adf-githubtest.json
      resource-group: rg-dataplatform
      plan-environment: "{deployment}"
      apply-environment: "{deployment}"
      # Dependabot's runs get no OIDC token, so they can't reach Azure: they
      # build and plan offline instead of skipping the job, so the required
      # Result check still reports
      what-if: ${{ github.actor != 'dependabot[bot]' }}
      apply: ${{ github.actor != 'dependabot[bot]' }}

  # The same for a Synapse workspace
  e2e-synapse:
    name: E2E synapse
    uses: $/.github/workflows/synapse.yaml
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: write
    with:
      working-directory: tests/fixtures/synapse/basic
      deployments: deployments/*.json
      resource-group: rg-fixture-{deployment}
      what-if: false
      apply: false
