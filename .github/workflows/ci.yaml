# CI for this library: lint everything, then run the OpenTofu reusable
# workflow end to end -- from this commit -- against the test fixture, the
# same way a consumer calls it.
#
# The fixture needs no cloud account (random_pet/terraform_data, local
# state), so the e2e run plans, comments on the PR, and applies without an
# approval environment. Require "Lint", "E2E / Result" and
# "E2E plan-only / Result" in branch protection.

name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-lint-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the tool versions pinned in mise.toml. Dependabot doesn't
      # update `version`; bump it by hand now and then.
      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.12

      # The same hooks as local commits, so CI and local agree.
      # check-added-large-files only looks at staged files, so it's skipped.
      - name: pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: check-added-large-files
          # Authenticated tflint plugin downloads avoid GitHub API rate limits
          GITHUB_TOKEN: ${{ github.token }}

  # Every check on, plus policy and apply
  e2e:
    name: E2E
    uses: $/.github/workflows/opentofu.yaml
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: write
    with:
      working-directory: tests/fixtures/opentofu/basic
      var-files: fixture.tfvars
      docs: true
      policy: true
      policy-path: tests/fixtures/opentofu/basic/policy

  # Toggles off: plan only, most checks disabled, a separate PR comment
  e2e-plan-only:
    name: E2E plan-only
    uses: $/.github/workflows/opentofu.yaml
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: write
    with:
      working-directory: tests/fixtures/opentofu/basic
      stack-name: basic (plan only)
      var-files: fixture.tfvars
      tflint: false
      trivy: false
      tests: false
      apply: false
