# CI for this library: lint everything, then run the OpenTofu reusable
# workflows end to end -- from this commit -- against the test fixtures, the
# same way a consumer calls them.
#
# The fixtures need no cloud account (random_pet/terraform_data, local
# state), so the e2e runs plan, comment on the PR, and apply without an
# approval environment. Require "Lint", "E2E repo / Result",
# "E2E config / Result" and "E2E drift / Result" in branch protection.

name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-lint-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the tool versions pinned in mise.toml. Dependabot doesn't
      # update `version`; bump it by hand now and then.
      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.12

      # The same hooks as local commits, so CI and local agree
      - name: pre-commit
        run: .github/scripts/lint.sh
        env:
          # Authenticated tflint plugin downloads avoid GitHub API rate limits
          GITHUB_TOKEN: ${{ github.token }}

  # The repository entry point: discovers both fixture root modules and
  # deploys each -- basic twice (deployments/dev and prod .tfvars, each with
  # its own .tfbackend), minimal on its own -- with every default check, the
  # shared policy, and apply. changed-only is off so every PR exercises all
  # of them, whatever it changed.
  e2e-repo:
    name: E2E repo
    uses: $/.github/workflows/opentofu.yaml
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: write
    with:
      search-root: tests/fixtures/opentofu
      changed-only: false
      deployments: deployments/*.tfvars
      policy: true
      policy-path: tests/fixtures/opentofu/policy

  # One config directly, with toggles flipped: one deployment, the docs
  # check on, other checks off, policies pulled from a URL, plan only, and
  # its own PR comment
  e2e-config:
    name: E2E config
    uses: $/.github/workflows/opentofu-config.yaml
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: write
    with:
      working-directory: tests/fixtures/opentofu/basic
      stack-name: basic (config, plan only)
      deployments: deployments/dev.tfvars
      docs: true
      tflint: false
      trivy: false
      tests: false
      apply: false
      # The same fixture policy as e2e-repo, but pulled with policy-source
      # (conftest pull) instead of read from policy-path. The PR head, not
      # github.sha: a PR's merge commit can't be cloned by ref.
      policy: true
      policy-path: ""
      policy-source: git::https://github.com/${{ github.repository }}.git//tests/fixtures/opentofu/policy?ref=${{ github.event.pull_request.head.sha || github.sha }}

  # Drift detection over the same deployments. Local state starts empty on
  # every runner, so every check finds "drift": issues are off to keep the
  # repository quiet.
  e2e-drift:
    name: E2E drift
    uses: $/.github/workflows/opentofu-drift.yaml
    permissions:
      contents: read
      id-token: write
      issues: write
    with:
      search-root: tests/fixtures/opentofu
      deployments: deployments/*.tfvars
      create-issues: false
