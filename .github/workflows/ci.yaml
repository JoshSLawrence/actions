# CI for this library: lint everything (including the OpenTofu script
# tests), then run the reusable workflows end to end -- from this commit --
# against the test fixtures, the same way a consumer calls them.
#
# The OpenTofu fixtures need no cloud account (random_pet/terraform_data,
# local state), so the e2e calls plan, comment on the PR, and apply in the
# opentofu-fixture and staging environments, which have no reviewers. They
# must exist: the workflow refuses to run in an environment that doesn't
# (GitHub would create it, unprotected), so create them once in Settings ->
# Environments. The Data Factory and Synapse fixtures build (offline) and
# plan without what-if, which needs no Azure either. One more run deploys
# the Data Factory fixture to a real, otherwise empty factory
# (adf-githubtest), through the adf-githubtest environment: its variables
# hold the identity, whose only federated credential is for that
# environment. The SQL project fixture is built and planned offline against
# a baseline dacpac (no database or Azure), in both deploy modes, and a SQL
# Server container runs the real plan and publish scripts once more. Require
# "Lint", "E2E OpenTofu", "E2E datafactory / Result", "E2E synapse / Result",
# "E2E datafactory (Azure) / Result", "E2E sqlproject / Result", "E2E
# sqlproject truth / Result" and "SQL project engine" in branch protection.

name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-lint-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the tool versions pinned in mise.toml. Dependabot doesn't
      # update `version`; bump it by hand now and then.
      - name: Set up mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.12

      # The same hooks as local commits, so CI and local agree
      - name: pre-commit
        run: .github/scripts/lint.sh
        env:
          # Authenticated tflint plugin downloads avoid GitHub API rate limits
          GITHUB_TOKEN: ${{ github.token }}

  # OpenTofu, end to end: one call per fixture deployment, the way a
  # consumer calls it, with a per-file check (e2e-opentofu) like the one
  # opentofu/README.md recommends. Most calls turn changed-only off, so every
  # PR exercises them whatever it changed (tests/opentofu/ covers change
  # detection); e2e-tofu-staging keeps it on.

  # Every default check with the call's var file, the shared policy from
  # policy-path, and apply. The plan and apply jobs get their runners in the
  # JSON forms (an array of labels, a group-less runner object).
  e2e-tofu-dev:
    name: E2E tofu basic-dev
    uses: $/.github/workflows/opentofu.yaml
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: write
    with:
      working-directory: tests/fixtures/opentofu/basic
      var-files: deployments/dev.tfvars
      apply-environment: opentofu-fixture
      changed-only: false
      policy: true
      policy-path: tests/fixtures/opentofu/policy
      plan-runs-on: '["ubuntu-latest"]'
      apply-runs-on: '{"labels": ["ubuntu-latest"]}'

  # Plan only, with the same policy pulled from a URL (conftest pull)
  # instead. The PR head, not github.sha: a PR's merge commit can't be
  # cloned by ref.
  e2e-tofu-prod:
    name: E2E tofu basic-prod
    uses: $/.github/workflows/opentofu.yaml
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: write
    with:
      working-directory: tests/fixtures/opentofu/basic
      var-files: deployments/prod.tfvars
      apply-environment: opentofu-fixture
      changed-only: false
      apply: false
      policy: true
      policy-path: ""
      policy-source: git::https://github.com/${{ github.repository }}.git//tests/fixtures/opentofu/policy?ref=${{ github.event.pull_request.head.sha || github.sha }}

  # Change detection on: plans and applies only when the fixture, this call
  # or the OpenTofu workflow and its scripts changed. Checks off, and no
  # provider cache (the others use it).
  e2e-tofu-staging:
    name: E2E tofu basic-staging-eu
    uses: $/.github/workflows/opentofu.yaml
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: write
    with:
      working-directory: tests/fixtures/opentofu/basic
      var-files: deployments/staging-eu.tfvars
      apply-environment: staging
      checks: false
      provider-cache: false
      extra-paths: |
        .github/workflows/opentofu.yaml
        opentofu/**
        shared/**

  # A module without var files, providers or a lock file. It doesn't pin
  # terraform-docs, so docs is off. Checks get their runner as an object
  # with one label.
  e2e-tofu-minimal:
    name: E2E tofu minimal
    uses: $/.github/workflows/opentofu.yaml
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: write
    with:
      working-directory: tests/fixtures/opentofu/minimal
      apply-environment: opentofu-fixture
      changed-only: false
      docs: false
      checks-runs-on: '{"labels": "ubuntu-latest"}'

  # Drift detection: the fixture's state is local and empty on a fresh
  # runner, so the plan always has changes and the call must report drift.
  # Without issues (this repository keeps none for it) it only reports.
  e2e-tofu-drift:
    name: E2E tofu basic-drift
    uses: $/.github/workflows/opentofu-drift.yaml
    permissions:
      actions: read
      contents: read
      id-token: write
      issues: write
    with:
      working-directory: tests/fixtures/opentofu/basic
      var-files: deployments/dev.tfvars
      issues: false

  e2e-tofu-drift-found:
    name: E2E tofu basic-drift found drift
    needs: e2e-tofu-drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the drift output
        run: .github/scripts/assert-equal.sh
        env:
          WHAT: The drift output
          EXPECTED: "true"
          ACTUAL: ${{ needs.e2e-tofu-drift.outputs.drift }}

  # The one check for every OpenTofu call above
  e2e-opentofu:
    name: E2E OpenTofu
    needs:
      - e2e-tofu-dev
      - e2e-tofu-prod
      - e2e-tofu-staging
      - e2e-tofu-minimal
      - e2e-tofu-drift
      - e2e-tofu-drift-found
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check results
        uses: $/shared/result
        with:
          needs: ${{ toJSON(needs) }}

  # A factory with two deployments (deployments/dev.json and prod.json):
  # build -- which must leave out the fixture's stray pipeline/.keep -- then
  # plan each and comment on the PR. No what-if and no apply: those need a
  # real factory.
  e2e-datafactory:
    name: E2E datafactory
    uses: $/.github/workflows/datafactory.yaml
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: write
    with:
      working-directory: tests/fixtures/datafactory/basic
      deployments: deployments/*.json
      resource-group: rg-fixture-{deployment}
      what-if: false
      apply: false
      # Every job without its own runner gets it as JSON
      runs-on: '["ubuntu-latest"]'

  # The same fixture, deployed for real: what-if against the live factory,
  # then the pre-deployment script, the ARM deployment and the
  # post-deployment script, from the PR, without an approval (the
  # environment has no reviewers: it only scopes the credentials). A plan
  # with nothing to change skips the deploy. The fixture's trigger is
  # Stopped, so the factory never runs anything.
  e2e-datafactory-azure:
    name: E2E datafactory (Azure)
    uses: $/.github/workflows/datafactory.yaml
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: write
    with:
      working-directory: tests/fixtures/datafactory/basic
      stack-name: datafactory (adf-githubtest)
      deployments: ci/adf-githubtest.json
      resource-group: rg-dataplatform
      plan-environment: "{deployment}"
      apply-environment: "{deployment}"
      # Dependabot's runs get no OIDC token, so they can't reach Azure: they
      # build and plan offline instead of skipping the job, so the required
      # Result check still reports
      what-if: ${{ github.actor != 'dependabot[bot]' }}
      apply: ${{ github.actor != 'dependabot[bot]' }}

  # The same for a Synapse workspace
  e2e-synapse:
    name: E2E synapse
    uses: $/.github/workflows/synapse.yaml
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: write
    with:
      working-directory: tests/fixtures/synapse/basic
      deployments: deployments/*.json
      resource-group: rg-fixture-{deployment}
      what-if: false
      apply: false
      build-runs-on: '["ubuntu-latest"]'

  # A SQL project with two deployments (deployments/dev.publish.xml and
  # prod.publish.xml): build the dacpac (and, on PRs, the base commit's to
  # compare the deployment scripts), then plan each offline against
  # ci/baseline.dacpac and comment on the PR. Additive: the rename and the
  # creates plan without data loss, and Extra is listed as kept. No
  # database, so no apply.
  e2e-sqlproject:
    name: E2E sqlproject
    uses: $/.github/workflows/sqlproject.yaml
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: write
    with:
      working-directory: tests/fixtures/sqlproject/basic
      stack-name: sqlproject (additive)
      deployments: deployments/*.publish.xml
      target-dacpac: ci/baseline.dacpac
      apply: false
      runs-on: '["ubuntu-latest"]'

  # The same in truth mode: the project is the source of truth, so Extra
  # would be dropped, which is possible data loss: allowed here, or the
  # plans would be blocked.
  e2e-sqlproject-truth:
    name: E2E sqlproject truth
    uses: $/.github/workflows/sqlproject.yaml
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: write
    with:
      working-directory: tests/fixtures/sqlproject/basic
      stack-name: sqlproject (truth)
      deployments: deployments/*.publish.xml
      target-dacpac: ci/baseline.dacpac
      deploy-mode: truth
      allow-data-loss: true
      apply: false
      runs-on: '["ubuntu-latest"]'

  # The plan and publish scripts against a real SQL Server in a container
  # (docker is on the runner): deploy modes, renames, data loss, deployment
  # scripts and the apply's refusals.
  sqlproject-engine:
    name: SQL project engine
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up tools
        uses: $/shared/setup
        with:
          working-directory: tests/fixtures/sqlproject/basic
          required-tools: dotnet dotnet:microsoft.sqlpackage yq

      - name: Run the engine test
        run: tests/sqlproject/engine-test.sh
