# OpenTofu building block: test -> plan -> apply for ONE deployment of a
# root module (deployments/<name>.yaml with its .tfvars, or the module's
# deployment.yaml). opentofu-config.yaml calls it once per deployment, after
# validating the module once; opentofu.yaml calls that once per root module.
# It's not meant to be called on its own.
#
# - integration-tests (opt-in): tofu test with the deployment's .tfvars and
#   declared credentials, in integration-test-environment.
# - plan: plans to a file, uploads it as an artifact, and comments the
#   summary on the PR. Skipped for fork PRs, which get no OIDC token/secrets.
# - apply: only when the plan has changes. Waits for the apply environment's
#   approval, checks the plan is still current, then applies exactly that
#   plan. By default it applies from the PR before merge, so the default
#   branch only ever holds configuration that has applied successfully.
#
# Every job exports what the deployment's file declares -- literal values,
# and GitHub variables and secrets by name -- resolved in that job's own
# environment, so the same name can give plans a read-only identity and
# applies a write one (shared/scripts/export-declared.sh).
#
# The composite actions are referenced with the self-repository syntax
# (uses: $/...), which resolves to this repository at the exact commit being
# run -- so a caller pinned to a tag or SHA gets matching actions and
# scripts. It needs runner 2.336.0+ (GitHub-hosted runners always qualify).

name: OpenTofu deploy

on:
  workflow_call:
    inputs:
      # --- What to deploy ---------------------------------------------------
      working-directory:
        description: Root module directory, relative to the repository root.
        type: string
        required: true
      deployment:
        description: Deployment name (deployments/<name>.yaml), for names and titles. Empty for a module deployed as is.
        type: string
        default: ""
      deployment-file:
        description: The deployment's file, relative to the working directory (deployments/<name>.yaml, or deployment.yaml).
        type: string
        required: true
      var-files:
        description: The deployment's .tfvars, relative to the working directory, if it has one.
        type: string
        default: ""
      env:
        description: JSON object of the literal values the deployment's file declares (env).
        type: string
        default: "{}"
      var-names:
        description: GitHub variables the deployment's file declares (vars), space-separated.
        type: string
        default: ""
      secret-names:
        description: GitHub secrets the deployment's file declares (secrets), space-separated.
        type: string
        default: ""
      runs-on:
        description: Runner label for every job.
        type: string
        default: ubuntu-latest
      timeout-minutes:
        description: Timeout for each job.
        type: number
        default: 30
      mise-version:
        description: "mise version to install (default: the setup action's pin)."
        type: string
        default: ""

      # --- Integration tests ------------------------------------------------
      test-verbose:
        description: Pass -verbose to tofu test.
        type: boolean
        default: false
      integration-tests:
        description: >-
          Run tofu test again per deployment, before its plan, with its .tfvars
          and the variables and secrets its file declares (after validate
          passes).
        type: boolean
        default: false
      integration-test-filter:
        description: 'Test files for the integration jobs (default: all).'
        type: string
        default: ""
      integration-test-environment:
        description: >-
          GitHub environment for the integration jobs (approval gate; the
          deployments' declared variables and secrets resolve there). Must
          exist.
        type: string
        default: ""
      integration-test-timeout-minutes:
        description: >-
          Timeout for the integration jobs. Generous: a timeout kills tofu test
          mid-apply, leaking what it created.
        type: number
        default: 90

      # --- Plan -------------------------------------------------------------
      plan-environment:
        description: GitHub environment for the plan job (no reviewers; scopes read-only credentials). Must exist.
        type: string
        default: ""
      plan-retention-days:
        description: Days to keep the plan artifact (an approval after that fails).
        type: number
        default: 7
      pr-comment:
        description: Comment the plan (and apply result) on the PR.
        type: boolean
        default: true
      policy:
        description: Evaluate the plan with conftest; failing policy blocks the apply.
        type: boolean
        default: false
      policy-path:
        description: Policy directories, relative to the repository root.
        type: string
        default: policy
      policy-source:
        description: go-getter URL to pull (more) policies from.
        type: string
        default: ""
      policy-namespaces:
        description: "Rego namespaces to evaluate (default: all)."
        type: string
        default: ""
      policy-fail-on-warn:
        description: Also block on warn rules.
        type: boolean
        default: false
      cost-estimate:
        description: Add an Infracost estimate to the plan summary (needs the infracost-api-key secret).
        type: boolean
        default: false

      # --- Apply ------------------------------------------------------------
      apply:
        description: Include the apply job at all. false = plan only.
        type: boolean
        default: true
      apply-from-pr:
        description: >-
          Apply the reviewed plan from the PR, before merge. false = PRs only
          plan; applies happen on push/dispatch runs on the default branch.
        type: boolean
        default: true
      apply-environment:
        description: GitHub environment for the apply job. Give it required reviewers -- that's the approval gate. Must exist.
        type: string
        required: true
      preflight-paths:
        description: >-
          Paths (or globs) the plan depends on (default: the working
          directory). A change to any of them on the target branch since the
          plan makes it stale.
        type: string
        default: ""

    secrets:
      modules-token:
        description: Token that can read private GitHub repositories used as module/policy sources.
        required: false
      infracost-api-key:
        description: Infracost API key, for cost-estimate.
        required: false

    outputs:
      has-changes:
        description: "'true' if the plan has changes."
        value: ${{ jobs.plan.outputs.has-changes }}
      applied:
        description: "'true' if the apply job applied the plan."
        value: ${{ jobs.apply.outputs.applied }}

permissions: {}

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  integration-tests:
    name: Integration tests
    # Fork PRs get no OIDC token or secrets, so they can't run these
    if: >-
      inputs.integration-tests && (
        github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ inputs.integration-test-environment }}
    # Never cancelled by a newer push: that kills tofu test mid-apply,
    # leaking whatever it created (the same goes for hitting the timeout).
    timeout-minutes: ${{ inputs.integration-test-timeout-minutes }}
    concurrency:
      group: opentofu-integration-${{ github.repository }}-${{ inputs.working-directory }}-${{ inputs.deployment }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # cloud OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up tools
        uses: $/shared/setup
        with:
          working-directory: ${{ inputs.working-directory }}
          required-tools: opentofu
          mise-version: ${{ inputs.mise-version }}
          # What the deployment's file declares, resolved in this job's
          # environment (integration-test-environment)
          deployment-file: ${{ format('{0}/{1}', inputs.working-directory, inputs.deployment-file) }}
          environment: ${{ inputs.integration-test-environment }}
          env-json: ${{ inputs.env }}
          var-names: ${{ inputs.var-names }}
          secret-names: ${{ inputs.secret-names }}
          vars-json: ${{ toJSON(vars) }}
          # Every secret this job can see, but only for a deployment that
          # declares secrets; the setup step exports just the declared ones
          # (approved trade-off: GitHub has no other way to read a secret by
          # a name chosen at run time).
          secrets-json: ${{ inputs.secret-names != '' && toJSON(secrets) || '' }} # zizmor: ignore[overprovisioned-secrets]

      - name: Integration tests
        uses: $/opentofu/checks
        with:
          working-directory: ${{ inputs.working-directory }}
          fmt: "false"
          validate: "false"
          tflint: "false"
          trivy: "false"
          docs: "false"
          tests: "true"
          test-filter: ${{ inputs.integration-test-filter }}
          test-verbose: ${{ inputs.test-verbose }}
          var-files: ${{ inputs.var-files }}
          modules-token: ${{ secrets.modules-token }}

  plan:
    name: Plan
    needs: integration-tests
    # Fork PRs get no OIDC token or secrets, so they can't plan.
    # !cancelled(): integration-tests is usually skipped, which would
    # otherwise skip this too.
    if: >-
      !cancelled() &&
      (needs.integration-tests.result == 'success' || needs.integration-tests.result == 'skipped') &&
      (
        github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ inputs.plan-environment }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # A newer push supersedes a plan in progress. Safe to cancel: plans don't
    # lock the state.
    concurrency:
      group: opentofu-plan-${{ github.repository }}-${{ inputs.working-directory }}-${{ inputs.deployment }}-${{ inputs.apply-environment }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write # cloud OIDC (state backend, providers)
      pull-requests: write # plan comment
    outputs:
      has-changes: ${{ steps.plan.outputs.has-changes }}
      plan-sha256: ${{ steps.plan.outputs.plan-sha256 }}
      artifact-name: ${{ steps.plan.outputs.artifact-name }}
      comment-key: ${{ steps.plan.outputs.key }}
      title: ${{ steps.plan.outputs.title }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up tools
        uses: $/shared/setup
        with:
          working-directory: ${{ inputs.working-directory }}
          required-tools: >-
            opentofu
            ${{ inputs.policy && 'conftest' || '' }}
            ${{ inputs.cost-estimate && 'infracost' || '' }}
          mise-version: ${{ inputs.mise-version }}
          # What the deployment's file declares, resolved in this job's
          # environment (plan-environment, else repository level)
          deployment-file: ${{ format('{0}/{1}', inputs.working-directory, inputs.deployment-file) }}
          environment: ${{ inputs.plan-environment }}
          env-json: ${{ inputs.env }}
          var-names: ${{ inputs.var-names }}
          secret-names: ${{ inputs.secret-names }}
          vars-json: ${{ toJSON(vars) }}
          # See integration-tests: only for a deployment that declares secrets
          secrets-json: ${{ inputs.secret-names != '' && toJSON(secrets) || '' }} # zizmor: ignore[overprovisioned-secrets]

      - name: Plan
        id: plan
        uses: $/opentofu/plan
        with:
          working-directory: ${{ inputs.working-directory }}
          deployment: ${{ inputs.deployment }}
          environment: ${{ inputs.apply-environment }}
          var-files: ${{ inputs.var-files }}
          policy: ${{ inputs.policy }}
          policy-path: ${{ inputs.policy-path }}
          policy-source: ${{ inputs.policy-source }}
          policy-namespaces: ${{ inputs.policy-namespaces }}
          policy-fail-on-warn: ${{ inputs.policy-fail-on-warn }}
          cost-estimate: ${{ inputs.cost-estimate }}
          infracost-api-key: ${{ secrets.infracost-api-key }}
          modules-token: ${{ secrets.modules-token }}

      # The plan embeds the configuration and a copy of the state, and
      # artifacts of a public repository can be downloaded by any signed-in
      # user. Keep secrets out of state, or encrypt plans with OpenTofu's
      # TF_ENCRYPTION (declared in the deployment's file).
      - name: Upload plan
        if: inputs.apply && steps.plan.outputs.has-changes == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.plan.outputs.artifact-name }}
          path: ${{ steps.plan.outputs.plan-dir }}
          if-no-files-found: error
          retention-days: ${{ inputs.plan-retention-days }}
          # .terraform.lock.hcl travels with the plan
          include-hidden-files: true
          # A re-run uploads again under the same name; apply checks the
          # digest from this attempt's plan output either way.
          overwrite: true

      - name: Comment plan on PR
        if: ${{ !cancelled() && github.event_name == 'pull_request' && inputs.pr-comment && steps.plan.outputs.key != '' }}
        uses: $/shared/pr-comment
        with:
          comment-key: ${{ steps.plan.outputs.key }}
          title: ${{ steps.plan.outputs.title }}
          summary-file: ${{ steps.plan.outputs.summary-file || format('{0}/tofu-plan/summary.md', runner.temp) }}
          apply-environment: ${{ inputs.apply-environment }}
          apply-status: >-
            ${{
              steps.plan.outputs.has-changes != 'true' && 'none' ||
              steps.plan.outputs.policy-passed == 'false' && 'blocked' ||
              !inputs.apply && 'none' ||
              !inputs.apply-from-pr && 'after-merge' ||
              'awaiting-approval'
            }}

  apply:
    name: Apply
    needs: plan
    # PR runs apply only with apply-from-pr; other runs (push, dispatch) only
    # on the default branch -- use environment branch policies for more.
    # !cancelled() and the plan's own result: without a status function the
    # implied success() also needs integration-tests to have succeeded, and
    # it's usually skipped, which would skip this too.
    if: >-
      !cancelled() &&
      needs.plan.result == 'success' &&
      inputs.apply &&
      needs.plan.outputs.has-changes == 'true' &&
      (
        (github.event_name == 'pull_request' && inputs.apply-from-pr) ||
        (github.event_name != 'pull_request' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
      )
    runs-on: ${{ inputs.runs-on }}
    # Waits here for a reviewer's approval. The environment's variables and
    # secrets, and federated credentials for it, only apply once approved.
    environment: ${{ inputs.apply-environment }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # One apply at a time per deployment, and never cancel one that's
    # running: that could leave infrastructure half-changed and the state
    # locked. A newer run's apply queues behind.
    concurrency:
      group: opentofu-apply-${{ github.repository }}-${{ inputs.working-directory }}-${{ inputs.deployment }}-${{ inputs.apply-environment }}
      cancel-in-progress: false
    permissions:
      actions: read # environment protection rules; who approved, for the PR comment
      contents: read
      id-token: write # cloud OIDC
      pull-requests: write # apply result comment
    outputs:
      applied: ${{ steps.apply.outcome == 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Before the preflight check, so a refused apply still re-posts the plan
      # summary alongside the failure.
      - name: Download plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.plan.outputs.artifact-name }}
          path: ${{ runner.temp }}/tofu-plan

      - name: Set up tools
        uses: $/shared/setup
        with:
          working-directory: ${{ inputs.working-directory }}
          required-tools: opentofu
          mise-version: ${{ inputs.mise-version }}
          # What the deployment's file declares, resolved in this job's
          # environment (apply-environment)
          deployment-file: ${{ format('{0}/{1}', inputs.working-directory, inputs.deployment-file) }}
          environment: ${{ inputs.apply-environment }}
          env-json: ${{ inputs.env }}
          var-names: ${{ inputs.var-names }}
          secret-names: ${{ inputs.secret-names }}
          vars-json: ${{ toJSON(vars) }}
          # See integration-tests: only for a deployment that declares secrets
          secrets-json: ${{ inputs.secret-names != '' && toJSON(secrets) || '' }} # zizmor: ignore[overprovisioned-secrets]

      - name: Apply
        id: apply
        uses: $/opentofu/apply
        with:
          working-directory: ${{ inputs.working-directory }}
          plan-dir: ${{ runner.temp }}/tofu-plan
          plan-sha256: ${{ needs.plan.outputs.plan-sha256 }}
          environment: ${{ inputs.apply-environment }}
          var-files: ${{ inputs.var-files }}
          preflight-paths: ${{ inputs.preflight-paths }}
          modules-token: ${{ secrets.modules-token }}

      - name: Comment apply result on PR
        if: ${{ !cancelled() && github.event_name == 'pull_request' && inputs.pr-comment }}
        uses: $/shared/pr-comment
        with:
          comment-key: ${{ needs.plan.outputs.comment-key }}
          title: ${{ needs.plan.outputs.title }}
          summary-file: ${{ runner.temp }}/tofu-plan/summary.md
          apply-environment: ${{ inputs.apply-environment }}
          apply-status: ${{ steps.apply.outcome == 'success' && 'succeeded' || 'failed' }}
