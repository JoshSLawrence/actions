# OpenTofu reusable workflow: validate -> (integration tests) -> plan -> apply
#
# Call it from a workflow triggered on pull_request (and optionally push to
# the default branch / workflow_dispatch). See opentofu/README.md for every
# input, the setup it needs (environments, Azure federated credentials), and
# examples.
#
# Job layout (deliberate):
# - validate: static checks and unit tests. No cloud credentials, so it's
#   safe for PRs from forks.
# - integration-tests (opt-in): tofu test with cloud credentials, only after
#   validate passes, optionally behind an environment approval.
# - plan: plans to a file, uploads it as an artifact, and comments the
#   summary on the PR. Skipped for fork PRs, which get no OIDC token/secrets.
# - apply: only when the plan has changes. Waits for the apply environment's
#   approval, checks the plan is still current, then applies exactly that
#   plan. By default it applies from the PR before merge, so the default
#   branch only ever holds configuration that has applied successfully.
# - result: one stable check to require in branch protection. With
#   apply-from-pr, requiring it means a PR can't merge until its plan is
#   applied (or has no changes).
#
# The composite actions are referenced with the self-repository syntax
# (uses: $/...), which resolves to this repository at the exact commit being
# run -- so a caller pinned to a tag or SHA gets matching actions and
# scripts, and this repository's CI tests a PR's own changes. It needs
# runner 2.336.0+ (GitHub-hosted runners always qualify).

name: OpenTofu

on:
  workflow_call:
    inputs:
      # --- What to run on ---------------------------------------------------
      working-directory:
        description: Root module directory, relative to the repository root.
        type: string
        default: "."
      stack-name:
        description: >-
          Display name in PR comments and the job summary (default: the
          working directory). Set a distinct one when calling this workflow
          more than once for the same working-directory and apply-environment
          (e.g. per var-file), so the calls don't share a PR comment,
          artifact, or concurrency group.
        type: string
        default: ""
      runs-on:
        description: Runner label for every job.
        type: string
        default: ubuntu-latest
      timeout-minutes:
        description: Timeout for each job.
        type: number
        default: 30

      # --- Tool versions (a pin in your mise.toml always wins) --------------
      tofu-version:
        description: OpenTofu version when your mise config doesn't pin opentofu.
        type: string
        default: ""
      tflint-version:
        description: TFLint version when your mise config doesn't pin tflint.
        type: string
        default: ""
      trivy-version:
        description: Trivy version when your mise config doesn't pin trivy.
        type: string
        default: ""
      terraform-docs-version:
        description: terraform-docs version when your mise config doesn't pin it.
        type: string
        default: ""
      conftest-version:
        description: conftest version when your mise config doesn't pin it.
        type: string
        default: ""
      infracost-version:
        description: Infracost version when your mise config doesn't pin it.
        type: string
        default: ""
      mise-version:
        description: "mise version to install (default: the setup action's pin)."
        type: string
        default: ""

      # --- Checks -----------------------------------------------------------
      fmt:
        description: Check formatting.
        type: boolean
        default: true
      validate:
        description: Run tofu validate.
        type: boolean
        default: true
      tflint:
        description: Run TFLint.
        type: boolean
        default: true
      trivy:
        description: Run a Trivy misconfiguration scan.
        type: boolean
        default: true
      trivy-severity:
        description: "Severities that fail Trivy (default: trivy.yaml's, else CRITICAL,HIGH)."
        type: string
        default: ""
      docs:
        description: Check the terraform-docs README is up to date.
        type: boolean
        default: false
      tests:
        description: Run tofu test in the validate job (no cloud credentials).
        type: boolean
        default: true
      test-filter:
        description: 'Test files for the validate job, relative to the working directory; globs allowed (default: all).'
        type: string
        default: ""
      test-verbose:
        description: Pass -verbose to tofu test.
        type: boolean
        default: false
      integration-tests:
        description: Run tofu test again with cloud credentials, after validate passes.
        type: boolean
        default: false
      integration-test-filter:
        description: 'Test files for the integration job (default: all).'
        type: string
        default: ""
      integration-test-environment:
        description: GitHub environment for the integration job (approval gate, scoped credentials).
        type: string
        default: ""
      integration-test-timeout-minutes:
        description: >-
          Timeout for the integration job. Generous: a timeout kills tofu test
          mid-apply, leaking what it created.
        type: number
        default: 90

      # --- Plan -------------------------------------------------------------
      var-files:
        description: -var-file paths relative to the working directory, space- or newline-separated.
        type: string
        default: ""
      backend-config:
        description: -backend-config values, one per line (key=value, or a file relative to the working directory).
        type: string
        default: ""
      plan-environment:
        description: GitHub environment for the plan job (no reviewers; scopes read-only credentials).
        type: string
        default: ""
      plan-retention-days:
        description: Days to keep the plan artifact (an approval after that fails).
        type: number
        default: 7
      pr-comment:
        description: Comment the plan (and apply result) on the PR.
        type: boolean
        default: true
      policy:
        description: Evaluate the plan with conftest; failing policy blocks the apply.
        type: boolean
        default: false
      policy-path:
        description: Policy directories, relative to the repository root.
        type: string
        default: policy
      policy-source:
        description: go-getter URL to pull (more) policies from.
        type: string
        default: ""
      policy-namespaces:
        description: 'Rego namespaces to evaluate (default: all).'
        type: string
        default: ""
      policy-fail-on-warn:
        description: Also block on warn rules.
        type: boolean
        default: false
      cost-estimate:
        description: Add an Infracost estimate to the plan summary (needs the infracost-api-key secret).
        type: boolean
        default: false

      # --- Apply ------------------------------------------------------------
      apply:
        description: Include the apply job at all. false = plan only.
        type: boolean
        default: true
      apply-from-pr:
        description: >-
          Apply the reviewed plan from the PR, before merge. false = PRs only
          plan; applies happen on push/dispatch runs on the default branch.
        type: boolean
        default: true
      apply-environment:
        description: GitHub environment for the apply job. Give it required reviewers -- that's the approval gate.
        type: string
        default: ""
      preflight-paths:
        description: >-
          Repository paths the plan depends on (default: the working
          directory). Add local modules outside it, so a change to them on the
          target branch makes the plan stale.
        type: string
        default: ""

      # --- Cloud auth -------------------------------------------------------
      azure-client-id:
        description: 'Azure client ID for OIDC (default: the AZURE_CLIENT_ID variable, environment-scoped if set there).'
        type: string
        default: ""
      apply-azure-client-id:
        description: 'Separate (write) Azure identity for the apply job (default: azure-client-id).'
        type: string
        default: ""
      azure-tenant-id:
        description: 'Azure tenant ID (default: the AZURE_TENANT_ID variable).'
        type: string
        default: ""
      azure-subscription-id:
        description: 'Azure subscription ID (default: the AZURE_SUBSCRIPTION_ID variable).'
        type: string
        default: ""
      azure-login:
        description: Also run azure/login, for configurations that shell out to the az CLI.
        type: boolean
        default: false


    secrets:
      env-vars:
        description: KEY=VALUE lines exported (masked) in the integration, plan and apply jobs -- credentials for other providers, TF_VAR_*, TF_ENCRYPTION.
        required: false
      apply-env-vars:
        description: KEY=VALUE lines for the apply job only, added after (and overriding) env-vars.
        required: false
      modules-token:
        description: Token that can read private GitHub repositories used as module/policy sources.
        required: false
      infracost-api-key:
        description: Infracost API key, for cost-estimate.
        required: false

    outputs:
      has-changes:
        description: "'true' if the plan has changes."
        value: ${{ jobs.plan.outputs.has-changes }}
      applied:
        description: "'true' if the apply job applied the plan."
        value: ${{ jobs.apply.outputs.applied }}

permissions: {}

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  validate:
    name: Validate
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up tools
        uses: $/opentofu/setup
        with:
          working-directory: ${{ inputs.working-directory }}
          tools: >-
            opentofu
            ${{ inputs.tflint && 'tflint' || '' }}
            ${{ inputs.trivy && 'trivy' || '' }}
            ${{ inputs.docs && 'terraform-docs' || '' }}
          tofu-version: ${{ inputs.tofu-version }}
          tflint-version: ${{ inputs.tflint-version }}
          trivy-version: ${{ inputs.trivy-version }}
          terraform-docs-version: ${{ inputs.terraform-docs-version }}
          mise-version: ${{ inputs.mise-version }}

      - name: Checks
        uses: $/opentofu/checks
        with:
          working-directory: ${{ inputs.working-directory }}
          fmt: ${{ inputs.fmt }}
          validate: ${{ inputs.validate }}
          tflint: ${{ inputs.tflint }}
          trivy: ${{ inputs.trivy }}
          trivy-severity: ${{ inputs.trivy-severity }}
          docs: ${{ inputs.docs }}
          tests: ${{ inputs.tests }}
          test-filter: ${{ inputs.test-filter }}
          test-verbose: ${{ inputs.test-verbose }}
          modules-token: ${{ secrets.modules-token }}

  integration-tests:
    name: Integration tests
    needs: validate
    # Fork PRs get no OIDC token or secrets, so they can't run these
    if: >-
      inputs.integration-tests && (
        github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ inputs.integration-test-environment }}
    # Never cancelled by a newer push: that kills tofu test mid-apply,
    # leaking whatever it created (the same goes for hitting the timeout).
    timeout-minutes: ${{ inputs.integration-test-timeout-minutes }}
    concurrency:
      group: opentofu-integration-${{ github.repository }}-${{ inputs.working-directory }}-${{ inputs.stack-name }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # cloud OIDC
    env:
      ARM_USE_OIDC: ${{ (inputs.azure-client-id || vars.AZURE_CLIENT_ID) && 'true' || 'false' }}
      ARM_CLIENT_ID: ${{ inputs.azure-client-id || vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ inputs.azure-tenant-id || vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ inputs.azure-subscription-id || vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Azure login
        if: inputs.azure-login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}
          allow-no-subscriptions: ${{ env.ARM_SUBSCRIPTION_ID == '' }}

      - name: Set up tools
        uses: $/opentofu/setup
        with:
          working-directory: ${{ inputs.working-directory }}
          tools: opentofu
          tofu-version: ${{ inputs.tofu-version }}
          mise-version: ${{ inputs.mise-version }}
          env-vars: ${{ secrets.env-vars }}

      - name: Integration tests
        uses: $/opentofu/checks
        with:
          working-directory: ${{ inputs.working-directory }}
          fmt: "false"
          validate: "false"
          tflint: "false"
          trivy: "false"
          docs: "false"
          tests: "true"
          test-filter: ${{ inputs.integration-test-filter }}
          test-verbose: ${{ inputs.test-verbose }}
          modules-token: ${{ secrets.modules-token }}

  plan:
    name: Plan
    needs: validate
    # Fork PRs get no OIDC token or secrets, so they can't plan
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ inputs.plan-environment }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # A newer push supersedes a plan in progress. Safe to cancel: plans don't
    # lock the state.
    concurrency:
      group: opentofu-plan-${{ github.repository }}-${{ inputs.working-directory }}-${{ inputs.stack-name }}-${{ inputs.apply-environment }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write # cloud OIDC (state backend, providers)
      pull-requests: write # plan comment
    outputs:
      has-changes: ${{ steps.plan.outputs.has-changes }}
      plan-sha256: ${{ steps.plan.outputs.plan-sha256 }}
      artifact-name: ${{ steps.plan.outputs.artifact-name }}
      comment-key: ${{ steps.plan.outputs.key }}
      title: ${{ steps.plan.outputs.title }}
    env:
      ARM_USE_OIDC: ${{ (inputs.azure-client-id || vars.AZURE_CLIENT_ID) && 'true' || 'false' }}
      ARM_CLIENT_ID: ${{ inputs.azure-client-id || vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ inputs.azure-tenant-id || vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ inputs.azure-subscription-id || vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Azure login
        if: inputs.azure-login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}
          allow-no-subscriptions: ${{ env.ARM_SUBSCRIPTION_ID == '' }}

      - name: Set up tools
        uses: $/opentofu/setup
        with:
          working-directory: ${{ inputs.working-directory }}
          tools: >-
            opentofu
            ${{ inputs.policy && 'conftest' || '' }}
            ${{ inputs.cost-estimate && 'infracost' || '' }}
          tofu-version: ${{ inputs.tofu-version }}
          conftest-version: ${{ inputs.conftest-version }}
          infracost-version: ${{ inputs.infracost-version }}
          mise-version: ${{ inputs.mise-version }}
          env-vars: ${{ secrets.env-vars }}

      - name: Plan
        id: plan
        uses: $/opentofu/plan
        with:
          working-directory: ${{ inputs.working-directory }}
          stack-name: ${{ inputs.stack-name }}
          environment: ${{ inputs.apply-environment }}
          var-files: ${{ inputs.var-files }}
          backend-config: ${{ inputs.backend-config }}
          policy: ${{ inputs.policy }}
          policy-path: ${{ inputs.policy-path }}
          policy-source: ${{ inputs.policy-source }}
          policy-namespaces: ${{ inputs.policy-namespaces }}
          policy-fail-on-warn: ${{ inputs.policy-fail-on-warn }}
          cost-estimate: ${{ inputs.cost-estimate }}
          infracost-api-key: ${{ secrets.infracost-api-key }}
          modules-token: ${{ secrets.modules-token }}

      # The plan embeds the configuration and a copy of the state, and
      # artifacts of a public repository can be downloaded by any signed-in
      # user. Keep secrets out of state, or encrypt plans with OpenTofu's
      # TF_ENCRYPTION (passed through the env-vars secret).
      - name: Upload plan
        if: inputs.apply && steps.plan.outputs.has-changes == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.plan.outputs.artifact-name }}
          path: ${{ steps.plan.outputs.plan-dir }}
          if-no-files-found: error
          retention-days: ${{ inputs.plan-retention-days }}
          # .terraform.lock.hcl travels with the plan
          include-hidden-files: true
          # A re-run uploads again under the same name; apply checks the
          # digest from this attempt's plan output either way.
          overwrite: true

      - name: Comment plan on PR
        if: ${{ !cancelled() && github.event_name == 'pull_request' && inputs.pr-comment && steps.plan.outputs.key != '' }}
        uses: $/opentofu/pr-comment
        with:
          comment-key: ${{ steps.plan.outputs.key }}
          title: ${{ steps.plan.outputs.title }}
          summary-file: ${{ steps.plan.outputs.summary-file || format('{0}/tofu-plan/summary.md', runner.temp) }}
          apply-environment: ${{ inputs.apply-environment }}
          apply-status: >-
            ${{
              steps.plan.outputs.has-changes != 'true' && 'none' ||
              steps.plan.outputs.policy-passed == 'false' && 'blocked' ||
              !inputs.apply && 'none' ||
              !inputs.apply-from-pr && 'after-merge' ||
              'awaiting-approval'
            }}

  apply:
    name: Apply
    needs: [plan, integration-tests]
    # !cancelled(): run even though integration-tests may have been skipped.
    # PR runs apply only with apply-from-pr; other runs (push, dispatch) only
    # on the default branch -- use environment branch policies for more.
    if: >-
      !cancelled() && inputs.apply &&
      needs.plan.result == 'success' &&
      needs.plan.outputs.has-changes == 'true' &&
      (needs.integration-tests.result == 'success' || needs.integration-tests.result == 'skipped') &&
      (
        (github.event_name == 'pull_request' && inputs.apply-from-pr) ||
        (github.event_name != 'pull_request' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
      )
    runs-on: ${{ inputs.runs-on }}
    # Waits here for a reviewer's approval. Environment-scoped secrets,
    # variables and Azure federated credentials only apply once approved.
    environment: ${{ inputs.apply-environment }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # One apply at a time per module/environment, and never cancel one that's
    # running: that could leave infrastructure half-changed and the state
    # locked. A newer run's apply queues behind.
    concurrency:
      group: opentofu-apply-${{ github.repository }}-${{ inputs.working-directory }}-${{ inputs.stack-name }}-${{ inputs.apply-environment }}
      cancel-in-progress: false
    permissions:
      actions: read # environment protection rules; who approved, for the PR comment
      contents: read
      id-token: write # cloud OIDC
      pull-requests: write # apply result comment
    outputs:
      applied: ${{ steps.apply.outcome == 'success' }}
    env:
      ARM_USE_OIDC: ${{ (inputs.apply-azure-client-id || inputs.azure-client-id || vars.AZURE_CLIENT_ID) && 'true' || 'false' }}
      ARM_CLIENT_ID: ${{ inputs.apply-azure-client-id || inputs.azure-client-id || vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ inputs.azure-tenant-id || vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ inputs.azure-subscription-id || vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Before the preflight check, so a refused apply still re-posts the plan
      # summary alongside the failure.
      - name: Download plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.plan.outputs.artifact-name }}
          path: ${{ runner.temp }}/tofu-plan

      - name: Azure login
        if: inputs.azure-login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}
          allow-no-subscriptions: ${{ env.ARM_SUBSCRIPTION_ID == '' }}

      - name: Set up tools
        uses: $/opentofu/setup
        with:
          working-directory: ${{ inputs.working-directory }}
          tools: opentofu
          tofu-version: ${{ inputs.tofu-version }}
          mise-version: ${{ inputs.mise-version }}
          env-vars: |
            ${{ secrets.env-vars }}
            ${{ secrets.apply-env-vars }}

      - name: Apply
        id: apply
        uses: $/opentofu/apply
        with:
          working-directory: ${{ inputs.working-directory }}
          plan-dir: ${{ runner.temp }}/tofu-plan
          plan-sha256: ${{ needs.plan.outputs.plan-sha256 }}
          environment: ${{ inputs.apply-environment }}
          backend-config: ${{ inputs.backend-config }}
          preflight-paths: ${{ inputs.preflight-paths }}
          modules-token: ${{ secrets.modules-token }}

      - name: Comment apply result on PR
        if: ${{ !cancelled() && github.event_name == 'pull_request' && inputs.pr-comment }}
        uses: $/opentofu/pr-comment
        with:
          comment-key: ${{ needs.plan.outputs.comment-key }}
          title: ${{ needs.plan.outputs.title }}
          summary-file: ${{ runner.temp }}/tofu-plan/summary.md
          apply-environment: ${{ inputs.apply-environment }}
          apply-status: ${{ steps.apply.outcome == 'success' && 'succeeded' || 'failed' }}

  # The single check to require in branch protection -- see the header.
  result:
    name: Result
    needs: [validate, integration-tests, plan, apply]
    if: always()
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 5
    permissions: {}
    steps:
      # Every job must succeed or be skipped. validate has no `if`, so it's
      # only skipped when the run itself is broken; the others are skipped
      # when there's nothing for them to do.
      - name: Check job results
        env:
          NEEDS: ${{ toJSON(needs) }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if [ "$IS_FORK_PR" = "true" ]; then
            echo "::warning::This PR comes from a fork, which gets no cloud credentials, so it was validated but not planned. A maintainer can plan it by pushing the branch to this repository."
          fi
          failed=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key')
          for job in $failed; do
            echo "::error::Job '${job}' did not succeed. See its log."
          done
          [ -z "$failed" ]
