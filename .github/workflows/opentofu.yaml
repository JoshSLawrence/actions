# OpenTofu reusable workflow for a repository: point it at a directory, and
# it validates, plans and applies every root module ("config") under it --
# one (a single-root repository) or many (a monorepo) -- and every
# deployment of each (one per .tfvars file matching `deployments`).
#
# - discover: finds the root modules under search-root (directories with
#   *.tf files and their own mise.toml) and, on pull_request/push runs, keeps
#   the ones the change affects: their own files, local modules they use, or
#   shared-paths. See opentofu/scripts/discover.sh.
# - config: opentofu-config.yaml once per selected root module (a matrix):
#   validated once, then each deployment plans, comments on the PR, waits
#   for approval and applies on its own. Every input below except the
#   discovery ones applies to every module.
# - result: the single check to require in branch protection.
#
# Keep the inputs shared with opentofu-config.yaml identical, and passed
# through unchanged: .github/scripts/check-workflow-inputs.sh (a pre-commit
# hook) enforces it.

name: OpenTofu

on:
  workflow_call:
    inputs:
      # --- Discovery ----------------------------------------------------------
      search-root:
        description: >-
          Directory to search for root modules, relative to the repository
          root. It may itself be the (only) root module.
        type: string
        default: "."
      exclude:
        description: Globs of module paths to skip, space- or newline-separated (e.g. legacy/**).
        type: string
        default: ""
      modules:
        description: >-
          Run exactly these module paths, ignoring changes -- e.g. from a
          workflow_dispatch input. Each must be a discovered root module.
        type: string
        default: ""
      changed-only:
        description: >-
          On pull_request and push runs, only run the modules the change
          affects. Other events (workflow_dispatch, schedule) run every module.
        type: boolean
        default: true
      shared-paths:
        description: >-
          Globs whose change affects every module (e.g.
          .github/workflows/opentofu.yaml). Also make a plan stale in the
          apply preflight.
        type: string
        default: ""

      # --- What to run on -----------------------------------------------------
      runs-on:
        description: Runner label for every job.
        type: string
        default: ubuntu-latest
      timeout-minutes:
        description: Timeout for each job.
        type: number
        default: 30
      mise-version:
        description: "mise version to install (default: the setup action's pin)."
        type: string
        default: ""
      max-parallel:
        description: Most jobs of one matrix to run at once (root modules, and each one's deployments).
        type: number
        default: 4

      # --- Deployments --------------------------------------------------------
      deployments:
        description: >-
          .tfvars files, relative to each root module: one deployment each,
          planned and applied separately (e.g. deployments/*.tfvars; globs
          match within the module). A .tfbackend file next to one, with the
          same name, is added to its backend config. A module they match
          nothing in is deployed on its own.
        type: string
        default: ""
      var-files:
        description: Var files every deployment uses, before its own .tfvars, relative to the working directory.
        type: string
        default: ""
      backend-config:
        description: >-
          -backend-config values every deployment uses, one per line (key=value,
          or a file relative to the working directory). {deployment} is
          replaced with the deployment's name, e.g. key=infra-{deployment}.tfstate.
        type: string
        default: ""

      # --- Checks -------------------------------------------------------------
      fmt:
        description: Check formatting.
        type: boolean
        default: true
      validate:
        description: Run tofu validate.
        type: boolean
        default: true
      tflint:
        description: Run TFLint.
        type: boolean
        default: true
      trivy:
        description: Run a Trivy misconfiguration scan.
        type: boolean
        default: true
      trivy-severity:
        description: "Severities that fail Trivy (default: trivy.yaml's, else CRITICAL,HIGH)."
        type: string
        default: ""
      docs:
        description: Check the terraform-docs README is up to date.
        type: boolean
        default: false
      tests:
        description: Run tofu test in the validate job (no cloud credentials).
        type: boolean
        default: true
      test-filter:
        description: 'Test files for the validate job, relative to the working directory; globs allowed (default: all).'
        type: string
        default: ""
      test-verbose:
        description: Pass -verbose to tofu test.
        type: boolean
        default: false
      integration-tests:
        description: Run tofu test again with cloud credentials, after validate passes.
        type: boolean
        default: false
      integration-test-filter:
        description: 'Test files for the integration job (default: all).'
        type: string
        default: ""
      integration-test-environment:
        description: GitHub environment for the integration job (approval gate, scoped credentials).
        type: string
        default: ""
      integration-test-timeout-minutes:
        description: >-
          Timeout for the integration job. Generous: a timeout kills tofu test
          mid-apply, leaking what it created.
        type: number
        default: 90

      # --- Plan ---------------------------------------------------------------
      plan-environment:
        description: GitHub environment for the plan jobs (no reviewers; scopes read-only credentials). {deployment} is replaced.
        type: string
        default: ""
      plan-retention-days:
        description: Days to keep the plan artifact (an approval after that fails).
        type: number
        default: 7
      pr-comment:
        description: Comment the plan (and apply result) on the PR.
        type: boolean
        default: true
      policy:
        description: Evaluate the plan with conftest; failing policy blocks the apply.
        type: boolean
        default: false
      policy-path:
        description: Policy directories, relative to the repository root.
        type: string
        default: policy
      policy-source:
        description: go-getter URL to pull (more) policies from.
        type: string
        default: ""
      policy-namespaces:
        description: "Rego namespaces to evaluate (default: all)."
        type: string
        default: ""
      policy-fail-on-warn:
        description: Also block on warn rules.
        type: boolean
        default: false
      cost-estimate:
        description: Add an Infracost estimate to the plan summary (needs the infracost-api-key secret).
        type: boolean
        default: false

      # --- Apply --------------------------------------------------------------
      apply:
        description: Include the apply job at all. false = plan only.
        type: boolean
        default: true
      apply-from-pr:
        description: >-
          Apply the reviewed plan from the PR, before merge. false = PRs only
          plan; applies happen on push/dispatch runs on the default branch.
        type: boolean
        default: true
      apply-environment:
        description: >-
          GitHub environment for the apply jobs. Give it required reviewers --
          that's the approval gate. {deployment} is replaced, e.g.
          "{deployment}" for a dev and a prod environment.
        type: string
        default: ""
      # --- Cloud auth ---------------------------------------------------------
      azure-client-id:
        description: 'Azure client ID for OIDC (default: the AZURE_CLIENT_ID variable, environment-scoped if set there).'
        type: string
        default: ""
      apply-azure-client-id:
        description: "Separate (write) Azure identity for the apply job (default: azure-client-id)."
        type: string
        default: ""
      azure-tenant-id:
        description: "Azure tenant ID (default: the AZURE_TENANT_ID variable)."
        type: string
        default: ""
      azure-subscription-id:
        description: "Azure subscription ID (default: the AZURE_SUBSCRIPTION_ID variable)."
        type: string
        default: ""
      azure-login:
        description: Also run azure/login, for configurations that shell out to the az CLI.
        type: boolean
        default: false

    secrets:
      env-vars:
        description: KEY=VALUE lines exported (masked) in the integration, plan and apply jobs -- credentials for other providers, TF_VAR_*, TF_ENCRYPTION.
        required: false
      apply-env-vars:
        description: KEY=VALUE lines for the apply job only, added after (and overriding) env-vars.
        required: false
      modules-token:
        description: Token that can read private GitHub repositories used as module/policy sources.
        required: false
      infracost-api-key:
        description: Infracost API key, for cost-estimate.
        required: false



    outputs:
      modules:
        description: JSON array of the root module paths that ran.
        value: ${{ jobs.discover.outputs.modules }}

permissions: {}

jobs:
  discover:
    name: Discover
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      modules: ${{ steps.discover.outputs.modules }}
      has-modules: ${{ steps.discover.outputs.has-modules }}
    steps:
      # Full history: changes are diffed against the PR base / push before
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Discover root modules
        id: discover
        uses: $/opentofu/discover
        with:
          search-root: ${{ inputs.search-root }}
          exclude: ${{ inputs.exclude }}
          modules: ${{ inputs.modules }}
          changed-only: ${{ inputs.changed-only }}
          shared-paths: ${{ inputs.shared-paths }}
          deployments: ${{ inputs.deployments }}

  config:
    name: ${{ matrix.module.path }}
    needs: discover
    if: needs.discover.outputs.has-modules == 'true'
    strategy:
      # One module failing doesn't stop the others
      fail-fast: false
      max-parallel: ${{ inputs.max-parallel }}
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    uses: $/.github/workflows/opentofu-config.yaml
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: write
    with:
      # Resolved per module by discovery: the module, the local modules it
      # uses and shared-paths; and deployments, or "" where they match nothing
      working-directory: ${{ matrix.module.path }}
      preflight-paths: ${{ matrix.module.preflight_paths }}
      deployments: ${{ matrix.module.deployments }}
      runs-on: ${{ inputs.runs-on }}
      timeout-minutes: ${{ inputs.timeout-minutes }}
      mise-version: ${{ inputs.mise-version }}
      max-parallel: ${{ inputs.max-parallel }}
      var-files: ${{ inputs.var-files }}
      backend-config: ${{ inputs.backend-config }}
      fmt: ${{ inputs.fmt }}
      validate: ${{ inputs.validate }}
      tflint: ${{ inputs.tflint }}
      trivy: ${{ inputs.trivy }}
      trivy-severity: ${{ inputs.trivy-severity }}
      docs: ${{ inputs.docs }}
      tests: ${{ inputs.tests }}
      test-filter: ${{ inputs.test-filter }}
      test-verbose: ${{ inputs.test-verbose }}
      integration-tests: ${{ inputs.integration-tests }}
      integration-test-filter: ${{ inputs.integration-test-filter }}
      integration-test-environment: ${{ inputs.integration-test-environment }}
      integration-test-timeout-minutes: ${{ inputs.integration-test-timeout-minutes }}
      plan-environment: ${{ inputs.plan-environment }}
      plan-retention-days: ${{ inputs.plan-retention-days }}
      pr-comment: ${{ inputs.pr-comment }}
      policy: ${{ inputs.policy }}
      policy-path: ${{ inputs.policy-path }}
      policy-source: ${{ inputs.policy-source }}
      policy-namespaces: ${{ inputs.policy-namespaces }}
      policy-fail-on-warn: ${{ inputs.policy-fail-on-warn }}
      cost-estimate: ${{ inputs.cost-estimate }}
      apply: ${{ inputs.apply }}
      apply-from-pr: ${{ inputs.apply-from-pr }}
      apply-environment: ${{ inputs.apply-environment }}
      azure-client-id: ${{ inputs.azure-client-id }}
      apply-azure-client-id: ${{ inputs.apply-azure-client-id }}
      azure-tenant-id: ${{ inputs.azure-tenant-id }}
      azure-subscription-id: ${{ inputs.azure-subscription-id }}
      azure-login: ${{ inputs.azure-login }}
    secrets:
      env-vars: ${{ secrets.env-vars }}
      apply-env-vars: ${{ secrets.apply-env-vars }}
      modules-token: ${{ secrets.modules-token }}
      infracost-api-key: ${{ secrets.infracost-api-key }}

  # The single check to require in branch protection: it covers every
  # module and deployment, whichever ran.
  result:
    name: Result
    needs: [discover, config]
    if: always()
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 5
    # contents: read only to fetch this repository's result action: with
    # none, a private copy of this repository can't be downloaded.
    permissions:
      contents: read
    steps:
      - name: Check results
        uses: $/opentofu/result
        with:
          needs: ${{ toJSON(needs) }}
