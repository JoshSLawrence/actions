# OpenTofu for a repository: point it at a directory, and it validates,
# tests, plans and applies every root module under it, at any depth -- one
# (a single-root repository) or many (a monorepo), nested or not -- and
# every deployment of each.
#
#   <root module>/          *.tf, and a mise.toml pinning its tools
#   └── deployments/
#       ├── beans.yaml      deployment "beans": its environment, and the
#       │                   variables and secrets it gets
#       └── beans.tfvars    its OpenTofu variables (optional)
#
# (or one deployment.yaml in the module root, to deploy it once as is)
#
# - discover: finds the root modules under search-root (directories with
#   *.tf files and their own mise.toml). On pull_request/push runs it keeps
#   what the change affects: every deployment of a module whose own files
#   (child modules and tests included) or shared-paths changed; only the
#   deployments whose .yaml or .tfvars changed otherwise. It fails unless
#   every environment those deployments name exists. See
#   opentofu/scripts/discover.sh.
# - config: per selected root module (a matrix), validated once, then each
#   selected deployment tests, plans, comments on the PR, waits for approval
#   and applies on its own (opentofu-config.yaml -> opentofu-deploy.yaml,
#   the building blocks of this workflow; call this one).
# - result: the single check to require in branch protection.
#
# Each deployment's file declares what its jobs export as environment
# variables (provider settings, credentials): literal values, and GitHub
# variables and secrets by name, resolved in each job's environment. See
# opentofu/README.md.
#
# Keep the inputs shared with opentofu-config.yaml identical, and passed
# through unchanged: .github/scripts/check-workflow-inputs.sh (a pre-commit
# hook) enforces it.

name: OpenTofu

on:
  workflow_call:
    inputs:
      # --- Discovery ----------------------------------------------------------
      search-root:
        description: >-
          Directory to search for root modules, relative to the repository
          root. It may itself be the (only) root module.
        type: string
        default: "."
      exclude:
        description: Globs of module paths to skip, space- or newline-separated (e.g. legacy/**).
        type: string
        default: ""
      modules:
        description: >-
          Run exactly these module paths, every deployment, ignoring changes
          -- e.g. from a workflow_dispatch input. Each must be a discovered
          root module.
        type: string
        default: ""
      changed-only:
        description: >-
          On pull_request and push runs, only run what the change affects.
          Other events (workflow_dispatch, schedule) run everything.
        type: boolean
        default: true
      shared-paths:
        description: >-
          Globs whose change runs everything (e.g.
          .github/workflows/opentofu.yaml, or iac/modules/** for modules
          shared between root modules). Also make a plan stale in the apply
          preflight.
        type: string
        default: ""

      # --- What to run on -----------------------------------------------------
      runs-on:
        description: Runner label for every job.
        type: string
        default: ubuntu-latest
      timeout-minutes:
        description: Timeout for each job.
        type: number
        default: 30
      mise-version:
        description: "mise version to install (default: the setup action's pin)."
        type: string
        default: ""
      max-parallel:
        description: Most jobs of one matrix to run at once (root modules, and each one's deployments).
        type: number
        default: 4

      # --- Checks -------------------------------------------------------------
      fmt:
        description: Check formatting.
        type: boolean
        default: true
      validate:
        description: Run tofu validate.
        type: boolean
        default: true
      tflint:
        description: Run TFLint.
        type: boolean
        default: true
      trivy:
        description: Run a Trivy misconfiguration scan.
        type: boolean
        default: true
      trivy-severity:
        description: "Severities that fail Trivy (default: trivy.yaml's, else CRITICAL,HIGH)."
        type: string
        default: ""
      docs:
        description: Check the terraform-docs README is up to date.
        type: boolean
        default: false
      tests:
        description: Run tofu test in the validate job (no cloud credentials).
        type: boolean
        default: true
      test-filter:
        description: 'Test files for the validate job, relative to the working directory; globs allowed (default: all).'
        type: string
        default: ""
      test-verbose:
        description: Pass -verbose to tofu test.
        type: boolean
        default: false
      integration-tests:
        description: >-
          Run tofu test again per deployment, before its plan, with its .tfvars
          and the variables and secrets its file declares (after validate
          passes).
        type: boolean
        default: false
      integration-test-filter:
        description: 'Test files for the integration jobs (default: all).'
        type: string
        default: ""
      integration-test-environment:
        description: >-
          GitHub environment for the integration jobs (approval gate; the
          deployments' declared variables and secrets resolve there). Must
          exist.
        type: string
        default: ""
      integration-test-timeout-minutes:
        description: >-
          Timeout for the integration jobs. Generous: a timeout kills tofu test
          mid-apply, leaking what it created.
        type: number
        default: 90

      # --- Plan ---------------------------------------------------------------
      plan-retention-days:
        description: Days to keep the plan artifact (an approval after that fails).
        type: number
        default: 7
      pr-comment:
        description: Comment the plan (and apply result) on the PR.
        type: boolean
        default: true
      policy:
        description: Evaluate the plan with conftest; failing policy blocks the apply.
        type: boolean
        default: false
      policy-path:
        description: Policy directories, relative to the repository root.
        type: string
        default: policy
      policy-source:
        description: go-getter URL to pull (more) policies from.
        type: string
        default: ""
      policy-namespaces:
        description: "Rego namespaces to evaluate (default: all)."
        type: string
        default: ""
      policy-fail-on-warn:
        description: Also block on warn rules.
        type: boolean
        default: false
      cost-estimate:
        description: Add an Infracost estimate to the plan summary (needs the infracost-api-key secret).
        type: boolean
        default: false

      # --- Apply --------------------------------------------------------------
      apply:
        description: Include the apply job at all. false = plan only.
        type: boolean
        default: true
      apply-from-pr:
        description: >-
          Apply the reviewed plan from the PR, before merge. false = PRs only
          plan; applies happen on push/dispatch runs on the default branch.
        type: boolean
        default: true

    secrets:
      modules-token:
        description: Token that can read private GitHub repositories used as module/policy sources.
        required: false
      infracost-api-key:
        description: Infracost API key, for cost-estimate.
        required: false

    outputs:
      modules:
        description: JSON array of the root module paths that ran.
        value: ${{ jobs.discover.outputs.modules }}

permissions: {}

jobs:
  discover:
    name: Discover
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    permissions:
      actions: read # check the deployments' environments exist
      contents: read
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      modules: ${{ steps.discover.outputs.modules }}
      has-modules: ${{ steps.discover.outputs.has-modules }}
    steps:
      # Full history: changes are diffed against the PR base / push before
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Discover root modules
        id: discover
        uses: $/opentofu/discover
        with:
          search-root: ${{ inputs.search-root }}
          exclude: ${{ inputs.exclude }}
          modules: ${{ inputs.modules }}
          changed-only: ${{ inputs.changed-only }}
          shared-paths: ${{ inputs.shared-paths }}
          # Checked before any job names it, with the deployments' own
          also-required-environments: ${{ inputs.integration-tests && inputs.integration-test-environment || '' }}

  config:
    name: ${{ matrix.module.path }}
    needs: discover
    if: needs.discover.outputs.has-modules == 'true'
    strategy:
      # One module failing doesn't stop the others
      fail-fast: false
      max-parallel: ${{ inputs.max-parallel }}
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    uses: $/.github/workflows/opentofu-config.yaml
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: write
    with:
      # Resolved per module by discovery: the deployments the change
      # selected, read from their files
      working-directory: ${{ matrix.module.path }}
      deployments: ${{ matrix.module.deployments }}
      runs-on: ${{ inputs.runs-on }}
      timeout-minutes: ${{ inputs.timeout-minutes }}
      mise-version: ${{ inputs.mise-version }}
      max-parallel: ${{ inputs.max-parallel }}
      fmt: ${{ inputs.fmt }}
      validate: ${{ inputs.validate }}
      tflint: ${{ inputs.tflint }}
      trivy: ${{ inputs.trivy }}
      trivy-severity: ${{ inputs.trivy-severity }}
      docs: ${{ inputs.docs }}
      tests: ${{ inputs.tests }}
      test-filter: ${{ inputs.test-filter }}
      test-verbose: ${{ inputs.test-verbose }}
      integration-tests: ${{ inputs.integration-tests }}
      integration-test-filter: ${{ inputs.integration-test-filter }}
      integration-test-environment: ${{ inputs.integration-test-environment }}
      integration-test-timeout-minutes: ${{ inputs.integration-test-timeout-minutes }}
      plan-retention-days: ${{ inputs.plan-retention-days }}
      pr-comment: ${{ inputs.pr-comment }}
      policy: ${{ inputs.policy }}
      policy-path: ${{ inputs.policy-path }}
      policy-source: ${{ inputs.policy-source }}
      policy-namespaces: ${{ inputs.policy-namespaces }}
      policy-fail-on-warn: ${{ inputs.policy-fail-on-warn }}
      cost-estimate: ${{ inputs.cost-estimate }}
      apply: ${{ inputs.apply }}
      apply-from-pr: ${{ inputs.apply-from-pr }}
    secrets:
      modules-token: ${{ secrets.modules-token }}
      infracost-api-key: ${{ secrets.infracost-api-key }}

  # The single check to require in branch protection: it covers every
  # module and deployment, whichever ran.
  result:
    name: Result
    needs: [discover, config]
    if: always()
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 5
    # contents: read only to fetch this repository's result action: with
    # none, a private copy of this repository can't be downloaded.
    permissions:
      contents: read
    steps:
      - name: Check results
        uses: $/shared/result
        with:
          needs: ${{ toJSON(needs) }}
