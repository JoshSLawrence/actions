# SQL project reusable workflow for ONE project folder (an SDK-style
# Microsoft.Build.Sql project, as created by the VS Code SQL Database
# Projects extension), deployed to one or more databases: build the dacpac
# once, then plan -> apply each deployment.
#
# A deployment is the project's dacpac with one publish profile -- e.g.
# deployments/dev.publish.xml and prod.publish.xml, each naming its own
# server and database. The plan is SqlPackage's DeployReport and Script
# against the live database, shown on the PR; the apply, after the
# environment's approval, publishes exactly that plan, and only if the
# database still yields the same report.
#
# Two deploy modes (deploy-mode): additive (the default) never drops what
# isn't in the project, and the plan lists what it keeps; truth makes the
# project the source of truth and drops the rest, except keep-object-types.
# See sqlproject/source-of-truth.md.
#
# Tools: every job that runs one installs exactly what the project folder's
# own mise.toml pins (dotnet to build; dotnet:microsoft.sqlpackage and yq to
# plan and publish; azure-cli, with uv, for the Entra token) -- nothing from
# the repository root.
#
# Job layout (deliberate):
# - build: builds the dacpac once. No cloud credentials, so it's safe for PRs
#   from forks.
# - deployments: checks the inputs and resolves the deployments (their
#   profiles and environments) into a matrix.
# - deploy: sqlproject-deploy.yaml once per deployment -- each plans,
#   comments on the PR, waits for approval and publishes on its own.
# - result: one stable check for the project.
#
# Callers run it on pull_request and workflow_dispatch. There is no
# apply-after-merge mode: a PR's plans apply from the PR (so the default
# branch only holds what was applied, under a required check), and a run on
# the default branch plans, and applies after approval only if something
# changed.
#
# Runners: every runs-on input is a label, or JSON when it starts with { or
# [ -- an array of labels or a runner group -- which each job's runs-on
# parses. build-runs-on, plan-runs-on and apply-runs-on override runs-on for
# those jobs.
#
# Keep the inputs shared with sqlproject-deploy.yaml identical, and passed
# through unchanged: .github/scripts/check-workflow-inputs.sh enforces it.

name: SQL project

on:
  workflow_call:
    inputs:
      # --- What to run on -------------------------------------------------------
      working-directory:
        description: >-
          The SQL project's folder (exactly one *.sqlproj), relative to the
          repository root. It pins its own tools in a mise.toml.
        type: string
        default: "."
      stack-name:
        description: >-
          Display name in PR comments and the job summary (default: the working
          directory).
        type: string
        default: ""
      runs-on:
        description: >-
          Runner of every job without its own below: a label, or JSON (from
          { or [) for an array of labels or a runner group, e.g.
          {"group": "my-group"} or {"group": "my-group", "labels": ["linux"]}.
        type: string
        default: ubuntu-latest
      build-runs-on:
        description: "Runner of the build job, in the same forms (default: runs-on)."
        type: string
        default: ""
      plan-runs-on:
        description: "Runner of each deployment's plan job, in the same forms (default: runs-on). It must reach the database."
        type: string
        default: ""
      apply-runs-on:
        description: "Runner of each deployment's apply job, in the same forms (default: runs-on). It must reach the database."
        type: string
        default: ""
      timeout-minutes:
        description: Timeout for each job.
        type: number
        default: 30
      mise-version:
        description: "mise version to install (default: the setup action's pin)."
        type: string
        default: ""
      max-parallel:
        description: Most deployments to plan and apply at once.
        type: number
        default: 4
      # --- Deployments ----------------------------------------------------------
      deployments:
        description: >-
          Publish profiles (*.publish.xml), relative to the working directory: one
          deployment each, planned and applied separately (e.g.
          deployments/*.publish.xml; globs match within the folder). A profile
          names the server and the database, and the deployment is named after the
          file (prod.publish.xml is "prod").
        type: string
        required: true
      deploy-mode:
        description: >-
          additive: never drop what isn't in the project (the plan lists it as
          kept). truth: the project is the source of truth; drop what isn't in it,
          except keep-object-types.
        type: string
        default: additive
      keep-object-types:
        description: >-
          truth mode only: object types never dropped (SqlPackage
          DoNotDropObjectTypes), separated by ; or newlines. The project's own
          creates and changes of them still deploy. Empty keeps nothing.
        type: string
        default: "Users;Logins;DatabaseRoles;ApplicationRoles;RoleMembership;ServerRoles;ServerRoleMembership;Permissions;Credentials;DatabaseScopedCredentials;MasterKeys"
      deployment-scripts:
        description: >-
          When pre- and post-deployment scripts alone make a plan a change: changed
          (they differ from what is deployed: the base commit's build on a pull
          request, always on a dispatch) or always (every plan of a project that has
          them).
        type: string
        default: changed
      properties:
        description: >-
          Deploy properties every deployment uses, one Name=Value per line, after
          the profile's. DropObjectsNotInSource, DoNotDropObjectTypes and
          BlockOnPossibleDataLoss are set by other inputs and refused here.
        type: string
        default: ""
      variables:
        description: >-
          SQLCMD variables every deployment uses, one Name=Value per line, after the
          profile's. {deployment} is replaced with the deployment's name. They end
          up in the plan and its comment, so no secrets.
        type: string
        default: ""
      # --- Plan -----------------------------------------------------------------
      plan-environment:
        description: GitHub environment for the plan jobs (no reviewers; scopes read-only credentials). {deployment} is replaced.
        type: string
        default: ""
      plan-retention-days:
        description: Days to keep the dacpac and plan artifacts (an approval after that fails).
        type: number
        default: 7
      pr-comment:
        description: Comment the plan (and apply result) on the PR.
        type: boolean
        default: true
      target-dacpac:
        description: >-
          Plan against this .dacpac (relative to the working directory) instead of
          the live database: no Azure access. For tests and offline previews;
          needs apply false.
        type: string
        default: ""
      allow-data-loss:
        description: >-
          Let a plan with possible data loss be applied, and publish with
          BlockOnPossibleDataLoss=False. Off: such a plan is blocked.
        type: boolean
        default: false
      # --- Apply ----------------------------------------------------------------
      apply:
        description: Include the apply job at all. false = plan only.
        type: boolean
        default: true
      apply-environment:
        description: >-
          GitHub environment for the apply jobs. Give it required reviewers --
          that's the approval gate. {deployment} is replaced, e.g. "{deployment}"
          for a dev and a prod environment. Required with apply.
        type: string
        default: ""
      preflight-paths:
        description: >-
          Paths (or globs) every deployment's plan depends on (default: the working
          directory; each deployment's own profile is added, and the other
          profiles left out). A change to any on the target branch since the plan
          makes it stale.
        type: string
        default: ""
      # --- Cloud auth -----------------------------------------------------------
      azure-client-id:
        description: 'Azure client ID for OIDC (default: the AZURE_CLIENT_ID variable, environment-scoped if set there).'
        type: string
        default: ""
      apply-azure-client-id:
        description: "Separate (write) Azure identity for the apply job (default: azure-client-id)."
        type: string
        default: ""
      azure-tenant-id:
        description: "Azure tenant ID (default: the AZURE_TENANT_ID variable)."
        type: string
        default: ""
      azure-subscription-id:
        description: "Azure subscription ID (default: the AZURE_SUBSCRIPTION_ID variable; azure/login needs one, the token itself doesn't)."
        type: string
        default: ""

    outputs:
      deployments:
        description: JSON array of the deployment names.
        value: ${{ jobs.deployments.outputs.deployments }}

permissions: {}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DACFX_TELEMETRY_OPTOUT: "1"

jobs:
  build:
    name: Build
    runs-on: >-
      ${{
        (startsWith(inputs.build-runs-on || inputs.runs-on, '{') || startsWith(inputs.build-runs-on || inputs.runs-on, '['))
        && fromJSON(inputs.build-runs-on || inputs.runs-on)
        || inputs.build-runs-on || inputs.runs-on
      }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    outputs:
      artifact-name: ${{ steps.build.outputs.artifact-name }}
    steps:
      # The whole history: the deployment-scripts comparison builds the base
      # commit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up tools
        uses: $/shared/setup
        with:
          working-directory: ${{ inputs.working-directory }}
          required-tools: dotnet
          mise-version: ${{ inputs.mise-version }}

      - name: Build
        id: build
        uses: $/sqlproject/build
        with:
          working-directory: ${{ inputs.working-directory }}
          stack-name: ${{ inputs.stack-name }}
          deployment-scripts: ${{ inputs.deployment-scripts }}
          # Pull requests apply before they merge, so the base commit is what
          # is deployed; other runs have nothing to compare with
          scripts-base: >-
            ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'none' }}

      - name: Upload dacpac
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.build.outputs.artifact-name }}
          path: ${{ steps.build.outputs.dacpac-dir }}
          if-no-files-found: error
          retention-days: ${{ inputs.plan-retention-days }}
          overwrite: true

  deployments:
    name: Deployments
    runs-on: ${{ (startsWith(inputs.runs-on, '{') || startsWith(inputs.runs-on, '[')) && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      actions: read # checks the GitHub environments exist
      contents: read
    outputs:
      matrix: ${{ steps.deployments.outputs.matrix }}
      deployments: ${{ steps.deployments.outputs.deployments }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The profiles are XML: yq, from the project's own mise.toml, reads them
      - name: Set up tools
        uses: $/shared/setup
        with:
          working-directory: ${{ inputs.working-directory }}
          required-tools: yq
          mise-version: ${{ inputs.mise-version }}

      - name: Resolve deployments
        id: deployments
        uses: $/sqlproject/deployments
        with:
          working-directory: ${{ inputs.working-directory }}
          deployments: ${{ inputs.deployments }}
          deploy-mode: ${{ inputs.deploy-mode }}
          keep-object-types: ${{ inputs.keep-object-types }}
          deployment-scripts: ${{ inputs.deployment-scripts }}
          properties: ${{ inputs.properties }}
          variables: ${{ inputs.variables }}
          plan-environment: ${{ inputs.plan-environment }}
          apply-environment: ${{ inputs.apply-environment }}
          preflight-paths: ${{ inputs.preflight-paths }}
          apply: ${{ inputs.apply }}
          target-dacpac: ${{ inputs.target-dacpac }}

  deploy:
    name: ${{ matrix.deployment.name || 'deploy' }}
    needs: [build, deployments]
    strategy:
      # One deployment failing doesn't stop the others
      fail-fast: false
      max-parallel: ${{ inputs.max-parallel }}
      matrix: ${{ fromJSON(needs.deployments.outputs.matrix) }}
    uses: $/.github/workflows/sqlproject-deploy.yaml
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: write
    with:
      # Resolved by the build and deployments jobs
      dacpac-artifact: ${{ needs.build.outputs.artifact-name }}
      deployment: ${{ matrix.deployment.name }}
      profile: ${{ matrix.deployment.profile }}
      variables: ${{ matrix.deployment.variables }}
      plan-environment: ${{ matrix.deployment.plan_environment }}
      apply-environment: ${{ matrix.deployment.apply_environment }}
      preflight-paths: ${{ matrix.deployment.preflight_paths }}
      working-directory: ${{ inputs.working-directory }}
      stack-name: ${{ inputs.stack-name }}
      runs-on: ${{ inputs.runs-on }}
      plan-runs-on: ${{ inputs.plan-runs-on }}
      apply-runs-on: ${{ inputs.apply-runs-on }}
      timeout-minutes: ${{ inputs.timeout-minutes }}
      mise-version: ${{ inputs.mise-version }}
      deploy-mode: ${{ inputs.deploy-mode }}
      keep-object-types: ${{ inputs.keep-object-types }}
      deployment-scripts: ${{ inputs.deployment-scripts }}
      properties: ${{ inputs.properties }}
      plan-retention-days: ${{ inputs.plan-retention-days }}
      pr-comment: ${{ inputs.pr-comment }}
      target-dacpac: ${{ inputs.target-dacpac }}
      allow-data-loss: ${{ inputs.allow-data-loss }}
      apply: ${{ inputs.apply }}
      azure-client-id: ${{ inputs.azure-client-id }}
      apply-azure-client-id: ${{ inputs.apply-azure-client-id }}
      azure-tenant-id: ${{ inputs.azure-tenant-id }}
      azure-subscription-id: ${{ inputs.azure-subscription-id }}

  # The check for this project, covering every deployment
  result:
    name: Result
    needs: [build, deployments, deploy]
    if: always()
    runs-on: ${{ (startsWith(inputs.runs-on, '{') || startsWith(inputs.runs-on, '[')) && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: 5
    # contents: read only to fetch this repository's result action: with
    # none, a private copy of this repository can't be downloaded.
    permissions:
      contents: read
    steps:
      - name: Check results
        uses: $/shared/result
        with:
          needs: ${{ toJSON(needs) }}
          note: >-
            ${{
              github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' &&
              'This PR comes from Dependabot, which gets no secrets or OIDC token, so it was built but not planned.' ||
              ''
            }}
