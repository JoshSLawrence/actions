# OpenTofu drift detection for ONE root module with one set of var files:
# plans it -- without locking the state, never applying -- and reports
# whether the live infrastructure (or its state) still matches the
# configuration. Call it once per deployment, from a scheduled workflow on
# the default branch:
#
#   on:
#     schedule:
#       - cron: "0 6 * * *"
#     workflow_dispatch:
#
#   jobs:
#     prod:
#       uses: JoshSLawrence/actions/.github/workflows/opentofu-drift.yaml@v0.4.0
#       permissions:
#         actions: read
#         contents: read
#         id-token: write
#         issues: write
#       with:
#         working-directory: iac/identity
#         var-files: deployments/prod.tfvars
#         plan-azure-client-id: ${{ vars.PROD_READ_CLIENT_ID }}
#
# - prepare: checks every input up front and, when environment is set, that
#   the environment exists (so a typo can't create it, unprotected).
# - drift: the same tool setup, provider cache, Azure credentials and plan as
#   opentofu.yaml (no checks, tests or apply), then the report: a GitHub issue
#   for the drift -- opened on the first drift, updated in place while it
#   lasts, commented on and labelled drift-resolved once it's gone -- and
#   the outputs. The plan is never uploaded: it holds a copy of the state.
#
# Use a read-only identity (plan-azure-client-id), the way opentofu.yaml's
# plan job does. See opentofu/README.md, and
# docs/design/opentofu-per-root-module.md for why it's shaped this way.

name: OpenTofu drift

on:
  workflow_call:
    inputs:
      # --- What to check ------------------------------------------------------
      working-directory:
        description: The root module, relative to the repository root. Its own mise.toml pins its tools.
        type: string
        required: true
      var-files:
        description: >-
          .tfvars files, relative to the root module, in order, for init and
          plan -- the same as the deployment's opentofu.yaml call. Empty: the
          module's defaults (and its terraform.tfvars).
        type: string
        default: ""
      name:
        description: "Label for this call (e.g. prod-eastus) in titles and names (default: the last var file's name)."
        type: string
        default: ""

      # --- Environment --------------------------------------------------------
      environment:
        description: "GitHub environment of the drift job, e.g. to bind a read-only identity's OIDC subject (default: none). Must exist; give it no required reviewers, or every scheduled run waits."
        type: string
        default: ""

      # --- Azure (each client ID has its own client secret, under secrets) ----
      azure-client-id:
        description: "Client ID of the identity that plans, unless plan-azure-client-id is set, which is enough on its own (with azure-client-secret, or OIDC)."
        type: string
        default: ""
      azure-tenant-id:
        description: Tenant ID. Required with any client ID.
        type: string
        default: ""
      azure-subscription-id:
        description: Subscription ID.
        type: string
        default: ""
      plan-azure-client-id:
        description: Client ID of the plan job's identity, e.g. a read-only one (with plan-azure-client-secret, or OIDC).
        type: string
        default: ""
      azure-use-azuread:
        description: Microsoft Entra ID (RBAC) auth for storage -- the state storage account and the provider's storage data plane.
        type: boolean
        default: true

      # --- Report -------------------------------------------------------------
      issues:
        description: Open a GitHub issue per drifted deployment, update it while the drift lasts, and mark it resolved when it's gone. false only reports in the job summary and the outputs.
        type: boolean
        default: true
      issue-labels:
        description: "Labels of new issues, comma-separated (created if missing). The first also finds the deployment's issue again: don't remove it from an issue."
        type: string
        default: opentofu-drift
      issue-assignees:
        description: "GitHub logins new issues are assigned to, comma-separated (default: nobody)."
        type: string
        default: ""
      fail-on-drift:
        description: Fail the job when there is drift (e.g. for failure notifications). A failed plan always fails it.
        type: boolean
        default: false

      # --- Runner -------------------------------------------------------------
      runs-on:
        description: >-
          Runner of the jobs: a label, or JSON (from { or [) for an array of
          labels or a runner group, e.g. {"group": "my-group"} or
          {"group": "my-group", "labels": ["linux"]}. Needs to reach the
          state and the resources, like opentofu.yaml's plan-runs-on.
        type: string
        default: ubuntu-latest
      timeout-minutes:
        description: Timeout of the drift job.
        type: number
        default: 30
      provider-cache:
        description: Cache OpenTofu's providers across runs and jobs (Actions cache, keyed on the lock file). false downloads them in every job.
        type: boolean
        default: true
      mise-version:
        description: "mise version to install (default: the setup action's pin). The module's mise.toml pins its tools."
        type: string
        default: ""

    secrets:
      azure-client-secret:
        description: "Client secret of azure-client-id (default: OIDC)."
        required: false
      plan-azure-client-secret:
        description: "Client secret of plan-azure-client-id (default: OIDC)."
        required: false
      modules-token:
        description: >-
          Token that can read private GitHub repositories used as module or
          policy sources (the run's GITHUB_TOKEN reads only this repository).
        required: false

    outputs:
      drift:
        description: "'true' if the plan found drift, 'false' if not, 'error' if the check itself failed."
        value: ${{ jobs.drift.outputs.drift }}
      issue:
        description: Number of the deployment's open drift issue, if there is one.
        value: ${{ jobs.drift.outputs.issue }}

permissions: {}

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  prepare:
    name: Prepare
    runs-on: ${{ (startsWith(inputs.runs-on, '{') || startsWith(inputs.runs-on, '[')) && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: 10
    permissions:
      actions: read # check the environment exists
      contents: read
    outputs:
      name: ${{ steps.prepare.outputs.name }}
      key: ${{ steps.prepare.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check inputs and environment
        id: prepare
        uses: $/opentofu/prepare
        with:
          drift: "true"
          working-directory: ${{ inputs.working-directory }}
          var-files: ${{ inputs.var-files }}
          name: ${{ inputs.name }}
          plan-environment: ${{ inputs.environment }}
          issues: ${{ inputs.issues }}
          issue-labels: ${{ inputs.issue-labels }}
          # The identity that plans: a drift call needs only the read-only
          # plan-azure-client-id, no identity that can write
          azure-client-id: ${{ inputs.azure-client-id || inputs.plan-azure-client-id }}
          azure-tenant-id: ${{ inputs.azure-tenant-id }}
          plan-azure-client-id: ${{ inputs.plan-azure-client-id }}
          has-azure-client-secret: ${{ secrets.azure-client-secret != '' }}
          has-plan-azure-client-secret: ${{ secrets.plan-azure-client-secret != '' }}

      # Checked here, without installing, so a missing pin fails before any
      # work. Even after a failed step above, to report it too.
      - name: Check the tools are pinned
        if: ${{ !cancelled() }}
        uses: $/shared/setup
        with:
          working-directory: ${{ inputs.working-directory }}
          install: "false"
          mise-version: ${{ inputs.mise-version }}
          required-tools: opentofu

  drift:
    name: Drift
    needs: prepare
    runs-on: ${{ (startsWith(inputs.runs-on, '{') || startsWith(inputs.runs-on, '[')) && fromJSON(inputs.runs-on) || inputs.runs-on }}
    environment: ${{ inputs.environment }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # One check per deployment at a time, so two runs can't both open its
    # issue. Never cancelled: a plan is safe to lose, but a half-written
    # report isn't; a newer run waits its turn.
    concurrency:
      group: opentofu-drift-${{ github.repository }}-${{ needs.prepare.outputs.key }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # cloud OIDC (state backend, providers)
      issues: write # the drift issue
    outputs:
      drift: ${{ steps.report.outputs.drift }}
      issue: ${{ steps.report.outputs.issue }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up tools
        uses: $/shared/setup
        with:
          working-directory: ${{ inputs.working-directory }}
          required-tools: opentofu
          mise-version: ${{ inputs.mise-version }}

      - name: Cache providers
        uses: $/opentofu/provider-cache
        with:
          working-directory: ${{ inputs.working-directory }}
          enabled: ${{ inputs.provider-cache }}

      - name: Azure credentials
        uses: $/opentofu/azure
        with:
          role: plan
          client-id: ${{ inputs.azure-client-id || inputs.plan-azure-client-id }}
          tenant-id: ${{ inputs.azure-tenant-id }}
          subscription-id: ${{ inputs.azure-subscription-id }}
          client-secret: ${{ secrets.azure-client-secret }}
          plan-client-id: ${{ inputs.plan-azure-client-id }}
          plan-client-secret: ${{ secrets.plan-azure-client-secret }}
          use-azuread: ${{ inputs.azure-use-azuread }}

      # The saved plan stays on the runner: it embeds a copy of the state, so
      # it is never uploaded. No policy, cost estimate or checks section.
      - name: Plan
        id: plan
        uses: $/opentofu/plan
        with:
          working-directory: ${{ inputs.working-directory }}
          deployment: ${{ needs.prepare.outputs.name }}
          var-files: ${{ inputs.var-files }}
          modules-token: ${{ secrets.modules-token }}

      # After a failed plan too, to say the check failed (and fail the job
      # with an explanation) instead of leaving the issues looking current
      - name: Report drift
        id: report
        if: ${{ !cancelled() }}
        uses: $/opentofu/drift-report
        with:
          exit-code: ${{ steps.plan.outputs.exit-code }}
          summary-file: ${{ steps.plan.outputs.summary-file }}
          key: ${{ steps.plan.outputs.key }}
          title: ${{ steps.plan.outputs.title }}
          issues: ${{ inputs.issues }}
          issue-labels: ${{ inputs.issue-labels }}
          issue-assignees: ${{ inputs.issue-assignees }}
          fail-on-drift: ${{ inputs.fail-on-drift }}
