# OpenTofu drift detection: plans every deployment (deployments/<name>.yaml)
# of every root module under a directory against the default branch, and reports any
# with changes: the live infrastructure (or its state) no longer matches the
# configuration. Run it on a schedule:
#
#   on:
#     schedule:
#       - cron: "0 6 * * *"
#     workflow_dispatch:
#
# - discover: finds the root modules (like opentofu.yaml, always all of
#   them) and flattens their deployments into one matrix.
# - drift: per deployment, a lock-free plan (the same plan action the deploy
#   workflow uses), then an issue per drifted deployment -- opened on the
#   first drift, updated in place while it lasts, commented on and closed
#   once a check finds no changes. See opentofu/scripts/drift-report.sh.
# - result: fails if any check couldn't run (or drifted, with
#   fail-on-drift).
#
# Inputs it shares with opentofu.yaml have the same definitions:
# .github/scripts/check-workflow-inputs.sh enforces it.

name: OpenTofu drift

on:
  workflow_call:
    inputs:
      # --- Discovery ----------------------------------------------------------
      search-root:
        description: >-
          Directory to search for root modules, relative to the repository
          root. It may itself be the (only) root module.
        type: string
        default: "."
      exclude:
        description: Globs of module paths to skip, space- or newline-separated (e.g. legacy/**).
        type: string
        default: ""
      modules:
        description: >-
          Run exactly these module paths, every deployment, ignoring changes
          -- e.g. from a workflow_dispatch input. Each must be a discovered
          root module.
        type: string
        default: ""

      # --- Drift --------------------------------------------------------------
      create-issues:
        description: >-
          Open an issue per drifted deployment (updated by later checks, closed
          once the drift is gone).
        type: boolean
        default: true
      issue-labels:
        description: Labels for drift issues, comma-separated. The first one also finds existing issues.
        type: string
        default: drift
      fail-on-drift:
        description: Fail the run when any deployment has drifted (e.g. to get failure notifications).
        type: boolean
        default: false
      plan-environment:
        description: >-
          GitHub environment for the drift checks (no reviewers; scopes
          read-only credentials). Default: each deployment's
          plan-environment.
        type: string
        default: ""

      # --- Runners ------------------------------------------------------------
      runs-on:
        description: Runner label for every job.
        type: string
        default: ubuntu-latest
      timeout-minutes:
        description: Timeout for each job.
        type: number
        default: 30
      mise-version:
        description: "mise version to install (default: the setup action's pin)."
        type: string
        default: ""
      max-parallel:
        description: Most jobs of one matrix to run at once (root modules, and each one's deployments).
        type: number
        default: 4

      # --- Cloud auth ---------------------------------------------------------
      azure-client-id:
        description: 'Azure client ID for OIDC (default: the AZURE_CLIENT_ID variable, environment-scoped if set there).'
        type: string
        default: ""
      azure-tenant-id:
        description: "Azure tenant ID (default: the AZURE_TENANT_ID variable)."
        type: string
        default: ""
      azure-subscription-id:
        description: "Azure subscription ID (default: the AZURE_SUBSCRIPTION_ID variable)."
        type: string
        default: ""
      azure-login:
        description: Also run azure/login, for configurations that shell out to the az CLI.
        type: boolean
        default: false

    secrets:
      env-vars:
        description: KEY=VALUE lines exported (masked) in the integration, plan and apply jobs -- credentials for other providers, TF_VAR_*, TF_ENCRYPTION.
        required: false
      modules-token:
        description: Token that can read private GitHub repositories used as module/policy sources.
        required: false

permissions: {}

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  discover:
    name: Discover
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.discover.outputs.deployments-matrix }}
      has-modules: ${{ steps.discover.outputs.has-modules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Discover root modules and deployments
        id: discover
        uses: $/opentofu/discover
        with:
          search-root: ${{ inputs.search-root }}
          exclude: ${{ inputs.exclude }}
          modules: ${{ inputs.modules }}
          # Drift can be anywhere, whatever the last commit changed
          changed-only: "false"
          # Not yet in line with the deployment files' environments
          require-environments: "false"

  drift:
    name: ${{ matrix.deployment.path }}${{ matrix.deployment.name && format(' · {0}', matrix.deployment.name) || '' }}
    needs: discover
    if: needs.discover.outputs.has-modules == 'true'
    strategy:
      # One check failing doesn't stop the others
      fail-fast: false
      max-parallel: ${{ inputs.max-parallel }}
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ inputs.plan-environment || matrix.deployment.plan_environment }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      id-token: write # cloud OIDC (state backend, providers)
      issues: write # drift issues
    env:
      ARM_USE_OIDC: ${{ (inputs.azure-client-id || vars.AZURE_CLIENT_ID) && 'true' || 'false' }}
      ARM_CLIENT_ID: ${{ inputs.azure-client-id || vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ inputs.azure-tenant-id || vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ inputs.azure-subscription-id || vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Azure login
        if: inputs.azure-login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}
          allow-no-subscriptions: ${{ env.ARM_SUBSCRIPTION_ID == '' }}

      - name: Set up tools
        uses: $/shared/setup
        with:
          working-directory: ${{ matrix.deployment.path }}
          required-tools: opentofu
          mise-version: ${{ inputs.mise-version }}
          # The deployment file's literals and variables (its TF_VAR_*, its
          # identity); secrets still come from env-vars below
          deployment-file: ${{ format('{0}/{1}', matrix.deployment.path, matrix.deployment.file) }}
          environment: ${{ inputs.plan-environment || matrix.deployment.plan_environment }}
          env-json: ${{ matrix.deployment.env_json }}
          var-names: ${{ matrix.deployment.vars }}
          vars-json: ${{ toJSON(vars) }}
          env-secrets: ${{ secrets.env-vars }}

      - name: Plan
        id: plan
        uses: $/opentofu/plan
        with:
          working-directory: ${{ matrix.deployment.path }}
          deployment: ${{ matrix.deployment.name }}
          var-files: ${{ matrix.deployment.var_files }}
          modules-token: ${{ secrets.modules-token }}

      - name: Report drift
        uses: $/opentofu/drift-report
        with:
          has-changes: ${{ steps.plan.outputs.has-changes }}
          key: ${{ steps.plan.outputs.key }}
          summary-file: ${{ steps.plan.outputs.summary-file }}
          create-issues: ${{ inputs.create-issues }}
          labels: ${{ inputs.issue-labels }}
          fail-on-drift: ${{ inputs.fail-on-drift }}

  result:
    name: Result
    needs: [discover, drift]
    if: always()
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 5
    # contents: read only to fetch this repository's result action: with
    # none, a private copy of this repository can't be downloaded.
    permissions:
      contents: read
    steps:
      - name: Check results
        uses: $/shared/result
        with:
          needs: ${{ toJSON(needs) }}
