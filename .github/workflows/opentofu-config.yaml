# OpenTofu building block: ONE root module, validated once, then each of the
# deployments discovery selected tests, plans and applies on its own.
# opentofu.yaml calls it once per root module; it's not meant to be called on
# its own.
#
# Tools: every job runs `mise install` in the module, installing exactly
# what the module's own mise config pins -- nothing from the repository
# root. Each enabled check's tool must be pinned there.
#
# Job layout (deliberate):
# - validate: static checks and unit tests, once for the module. No cloud
#   credentials, so it's safe for PRs from forks.
# - deploy: opentofu-deploy.yaml once per deployment -- each runs its
#   integration tests (opt-in), plans, comments on the PR, waits for
#   approval and applies on its own. Skipped for a module without
#   deployment files, which is only validated and tested.
# - result: one stable check for the module.

name: OpenTofu config

on:
  workflow_call:
    inputs:
      # --- What to run ----------------------------------------------------------
      working-directory:
        description: Root module directory, relative to the repository root.
        type: string
        required: true
      deployments:
        description: >-
          JSON array of the deployments to run, as opentofu/discover resolved
          them from their files (name, file, var_files, apply_environment,
          plan_environment, env_json, vars, secrets, preflight_paths). "[]" =
          validate and test only.
        type: string
        default: "[]"

      # --- What to run on -----------------------------------------------------
      runs-on:
        description: Runner label for every job.
        type: string
        default: ubuntu-latest
      timeout-minutes:
        description: Timeout for each job.
        type: number
        default: 30
      mise-version:
        description: "mise version to install (default: the setup action's pin)."
        type: string
        default: ""
      max-parallel:
        description: Most jobs of one matrix to run at once (root modules, and each one's deployments).
        type: number
        default: 4

      # --- Checks -------------------------------------------------------------
      fmt:
        description: Check formatting.
        type: boolean
        default: true
      validate:
        description: Run tofu validate.
        type: boolean
        default: true
      tflint:
        description: Run TFLint.
        type: boolean
        default: true
      trivy:
        description: Run a Trivy misconfiguration scan.
        type: boolean
        default: true
      trivy-severity:
        description: "Severities that fail Trivy (default: trivy.yaml's, else CRITICAL,HIGH)."
        type: string
        default: ""
      docs:
        description: Check the terraform-docs README is up to date.
        type: boolean
        default: false
      tests:
        description: Run tofu test in the validate job (no cloud credentials).
        type: boolean
        default: true
      test-filter:
        description: 'Test files for the validate job, relative to the working directory; globs allowed (default: all).'
        type: string
        default: ""
      test-verbose:
        description: Pass -verbose to tofu test.
        type: boolean
        default: false
      integration-tests:
        description: >-
          Run tofu test again per deployment, before its plan, with its .tfvars
          and the variables and secrets its file declares (after validate
          passes).
        type: boolean
        default: false
      integration-test-filter:
        description: 'Test files for the integration jobs (default: all).'
        type: string
        default: ""
      integration-test-environment:
        description: >-
          GitHub environment for the integration jobs (approval gate; the
          deployments' declared variables and secrets resolve there). Must
          exist.
        type: string
        default: ""
      integration-test-timeout-minutes:
        description: >-
          Timeout for the integration jobs. Generous: a timeout kills tofu test
          mid-apply, leaking what it created.
        type: number
        default: 90

      # --- Plan ---------------------------------------------------------------
      plan-retention-days:
        description: Days to keep the plan artifact (an approval after that fails).
        type: number
        default: 7
      pr-comment:
        description: Comment the plan (and apply result) on the PR.
        type: boolean
        default: true
      policy:
        description: Evaluate the plan with conftest; failing policy blocks the apply.
        type: boolean
        default: false
      policy-path:
        description: Policy directories, relative to the repository root.
        type: string
        default: policy
      policy-source:
        description: go-getter URL to pull (more) policies from.
        type: string
        default: ""
      policy-namespaces:
        description: "Rego namespaces to evaluate (default: all)."
        type: string
        default: ""
      policy-fail-on-warn:
        description: Also block on warn rules.
        type: boolean
        default: false
      cost-estimate:
        description: Add an Infracost estimate to the plan summary (needs the infracost-api-key secret).
        type: boolean
        default: false

      # --- Apply --------------------------------------------------------------
      apply:
        description: Include the apply job at all. false = plan only.
        type: boolean
        default: true
      apply-from-pr:
        description: >-
          Apply the reviewed plan from the PR, before merge. false = PRs only
          plan; applies happen on push/dispatch runs on the default branch.
        type: boolean
        default: true

    secrets:
      modules-token:
        description: Token that can read private GitHub repositories used as module/policy sources.
        required: false
      infracost-api-key:
        description: Infracost API key, for cost-estimate.
        required: false


permissions: {}

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  validate:
    name: Validate
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up tools
        uses: $/shared/setup
        with:
          working-directory: ${{ inputs.working-directory }}
          required-tools: >-
            opentofu
            ${{ inputs.tflint && 'tflint' || '' }}
            ${{ inputs.trivy && 'trivy' || '' }}
            ${{ inputs.docs && 'terraform-docs' || '' }}
          mise-version: ${{ inputs.mise-version }}

      - name: Checks
        uses: $/opentofu/checks
        with:
          working-directory: ${{ inputs.working-directory }}
          fmt: ${{ inputs.fmt }}
          validate: ${{ inputs.validate }}
          tflint: ${{ inputs.tflint }}
          trivy: ${{ inputs.trivy }}
          trivy-severity: ${{ inputs.trivy-severity }}
          docs: ${{ inputs.docs }}
          tests: ${{ inputs.tests }}
          test-filter: ${{ inputs.test-filter }}
          test-verbose: ${{ inputs.test-verbose }}
          modules-token: ${{ secrets.modules-token }}

  deploy:
    # What applies where, e.g. beans → prod
    name: ${{ format('{0} → {1}', matrix.deployment.name || '(module as is)', matrix.deployment.apply_environment) }}
    needs: validate
    if: inputs.deployments != '[]'
    strategy:
      # One deployment failing doesn't stop the others
      fail-fast: false
      max-parallel: ${{ inputs.max-parallel }}
      matrix:
        deployment: ${{ fromJSON(inputs.deployments) }}
    uses: $/.github/workflows/opentofu-deploy.yaml
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: write
    with:
      # Resolved per deployment by discovery, from its file
      deployment: ${{ matrix.deployment.name }}
      deployment-file: ${{ matrix.deployment.file }}
      var-files: ${{ matrix.deployment.var_files }}
      env: ${{ matrix.deployment.env_json }}
      var-names: ${{ matrix.deployment.vars }}
      secret-names: ${{ matrix.deployment.secrets }}
      plan-environment: ${{ matrix.deployment.plan_environment }}
      apply-environment: ${{ matrix.deployment.apply_environment }}
      preflight-paths: ${{ matrix.deployment.preflight_paths }}
      working-directory: ${{ inputs.working-directory }}
      runs-on: ${{ inputs.runs-on }}
      timeout-minutes: ${{ inputs.timeout-minutes }}
      mise-version: ${{ inputs.mise-version }}
      test-verbose: ${{ inputs.test-verbose }}
      integration-tests: ${{ inputs.integration-tests }}
      integration-test-filter: ${{ inputs.integration-test-filter }}
      integration-test-environment: ${{ inputs.integration-test-environment }}
      integration-test-timeout-minutes: ${{ inputs.integration-test-timeout-minutes }}
      plan-retention-days: ${{ inputs.plan-retention-days }}
      pr-comment: ${{ inputs.pr-comment }}
      policy: ${{ inputs.policy }}
      policy-path: ${{ inputs.policy-path }}
      policy-source: ${{ inputs.policy-source }}
      policy-namespaces: ${{ inputs.policy-namespaces }}
      policy-fail-on-warn: ${{ inputs.policy-fail-on-warn }}
      cost-estimate: ${{ inputs.cost-estimate }}
      apply: ${{ inputs.apply }}
      apply-from-pr: ${{ inputs.apply-from-pr }}
    secrets:
      modules-token: ${{ secrets.modules-token }}
      infracost-api-key: ${{ secrets.infracost-api-key }}

  # The check for this module, covering every deployment
  result:
    name: Result
    needs: [validate, deploy]
    if: always()
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 5
    # contents: read only to fetch this repository's result action: with
    # none, a private copy of this repository can't be downloaded.
    permissions:
      contents: read
    steps:
      - name: Check results
        uses: $/shared/result
        with:
          needs: ${{ toJSON(needs) }}
