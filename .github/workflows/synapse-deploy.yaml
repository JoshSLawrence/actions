# Synapse reusable workflow: plan -> apply for ONE deployment of an exported
# workspace template (the template with one set of parameters, to one
# workspace).
#
# synapse.yaml builds the template once and calls this once per deployment.
# Call this directly only to build your own layout: upload synapse/build's
# template-dir as an artifact first, and pass its name as template-artifact.
#
# - plan: renders the deployment's parameters and, with what-if, compares
#   the template with the live workspace (new artifacts, and those the
#   deployment deletes). Uploads the plan (template + parameters + target, no
#   secrets) as an artifact, and comments the summary on the PR. Skipped for
#   fork PRs, which get no OIDC token/secrets.
# - apply: waits for the apply environment's approval, checks the plan is
#   still current, then deploys exactly that plan: stop started triggers,
#   publish every artifact with the Synapse workspace deployer, start
#   triggers. By default it deploys from the PR before merge, so the default
#   branch only ever holds a workspace that deployed successfully.
#
# Synapse artifacts are deployed through the workspace's development
# endpoint (https://<workspace>.dev.azuresynapse.net), not ARM: a workspace
# without public network access needs apply-runs-on and plan-runs-on (for
# what-if), or runs-on, to be a runner in its network.
#
# Runners: every runs-on input is a label, or JSON when it starts with { or
# [ -- an array of labels or a runner group -- which each job's runs-on
# parses. plan-runs-on and apply-runs-on override runs-on for those jobs.
#
# The composite actions are referenced with the self-repository syntax
# (uses: $/...), which resolves to this repository at the exact commit being
# run -- so a caller pinned to a tag or SHA gets matching actions and
# scripts. It needs runner 2.336.0+ (GitHub-hosted runners always qualify).

name: Synapse deploy

on:
  workflow_call:
    inputs:
      # --- What to deploy ---------------------------------------------------
      working-directory:
        description: >-
          The Synapse workspace's Git root folder (the root folder of its Git
          configuration), relative to the repository root. It pins its own
          tools in a mise.toml.
        type: string
        default: "."
      stack-name:
        description: >-
          Display name in PR comments and the job summary (default: the
          working directory).
        type: string
        default: ""
      deployment:
        description: Deployment name (usually its parameters file's), for names and titles. Empty for the template on its own.
        type: string
        default: ""
      template-artifact:
        description: Name of the artifact holding synapse/build's template-dir.
        type: string
        required: true
      parameter-files:
        description: ARM parameters files relative to the working directory, in order, space- or newline-separated.
        type: string
        default: ""
      parameters:
        description: >-
          Parameter values, one name=value per line, after the files. Values of
          int, bool, object and array parameters are JSON.
        type: string
        default: ""
      resource-group:
        description: Resource group to deploy to.
        type: string
        required: true
      runs-on:
        description: >-
          Runner of every job without its own below: a label, or JSON (from
          { or [) for an array of labels or a runner group, e.g.
          {"group": "my-group"} or {"group": "my-group", "labels": ["linux"]}.
        type: string
        default: ubuntu-latest
      plan-runs-on:
        description: "Runner of each deployment's plan job, in the same forms (default: runs-on)."
        type: string
        default: ""
      apply-runs-on:
        description: "Runner of each deployment's apply job, in the same forms (default: runs-on)."
        type: string
        default: ""
      timeout-minutes:
        description: Timeout for each job.
        type: number
        default: 30
      mise-version:
        description: "mise version to install (default: the setup action's pin)."
        type: string
        default: ""

      # --- Plan -------------------------------------------------------------
      plan-environment:
        description: GitHub environment for the plan job (no reviewers; scopes read-only credentials).
        type: string
        default: ""
      plan-retention-days:
        description: Days to keep the plan artifact (an approval after that fails).
        type: number
        default: 7
      pr-comment:
        description: Comment the plan (and apply result) on the PR.
        type: boolean
        default: true
      what-if:
        description: >-
          Compare each deployment with the live workspace in its plan job: new
          artifacts, and those the deployment deletes. Needs Azure credentials
          with Synapse Artifact User, and network access to the workspace;
          false = render parameters only, no Azure access.
        type: boolean
        default: true

      # --- Apply ------------------------------------------------------------
      apply:
        description: Include the apply job at all. false = plan only.
        type: boolean
        default: true
      apply-from-pr:
        description: >-
          Apply the reviewed plan from the PR, before merge. false = PRs only
          plan; applies happen on push/dispatch runs on the default branch.
        type: boolean
        default: true
      apply-environment:
        description: GitHub environment for the apply job. Give it required reviewers -- that's the approval gate.
        type: string
        default: ""
      preflight-paths:
        description: >-
          Paths (or globs) the plan depends on (default: the working
          directory). A change to any of them on the target branch since the
          plan makes it stale.
        type: string
        default: ""
      delete-artifacts:
        description: Delete artifacts in the workspace that aren't in the template (the workspace then mirrors the folder).
        type: boolean
        default: true
      deploy-managed-private-endpoints:
        description: >-
          Deploy the folder's managed private endpoints. false leaves them to
          infrastructure as code: they're left out of every deployment and
          never deleted. true deploys them; Synapse then also deletes those
          that aren't in the folder (its apply identity needs Synapse
          Administrator), Data Factory never deletes them.
        type: boolean
        default: false
      deploy-integration-runtimes:
        description: >-
          Deploy the folder's integration runtimes. false leaves them to
          infrastructure as code: they're left out of every deployment and
          never deleted. true deploys them; Data Factory's post-deployment
          script then also deletes those that aren't in the folder (Synapse
          never deletes them).
        type: boolean
        default: false
      manage-triggers:
        description: Stop started triggers before each deployment, and start them (and those the template marks Started) after.
        type: boolean
        default: true

      # --- Cloud auth -------------------------------------------------------
      azure-client-id:
        description: 'Azure client ID for OIDC (default: the AZURE_CLIENT_ID variable, environment-scoped if set there).'
        type: string
        default: ""
      apply-azure-client-id:
        description: "Separate (write) Azure identity for the apply job (default: azure-client-id)."
        type: string
        default: ""
      azure-tenant-id:
        description: "Azure tenant ID (default: the AZURE_TENANT_ID variable)."
        type: string
        default: ""
      azure-subscription-id:
        description: "Azure subscription ID (default: the AZURE_SUBSCRIPTION_ID variable)."
        type: string
        default: ""

    secrets:
      parameter-secrets:
        description: >-
          name=value lines for secure parameters, used by the what-if and the
          deployment and never saved in an artifact. Prefer Key Vault.
        required: false

    outputs:
      has-changes:
        description: "'true' if the plan has changes."
        value: ${{ jobs.plan.outputs.has-changes }}
      applied:
        description: "'true' if the apply job applied the plan."
        value: ${{ jobs.apply.outputs.applied }}

permissions: {}

jobs:
  plan:
    name: Plan
    # Fork PRs get no OIDC token or secrets, so they can't plan
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: >-
      ${{
        (startsWith(inputs.plan-runs-on || inputs.runs-on, '{') || startsWith(inputs.plan-runs-on || inputs.runs-on, '['))
        && fromJSON(inputs.plan-runs-on || inputs.runs-on)
        || inputs.plan-runs-on || inputs.runs-on
      }}
    environment: ${{ inputs.plan-environment }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # A newer push supersedes a plan in progress. Safe to cancel: plans
    # change nothing.
    concurrency:
      group: synapse-plan-${{ github.repository }}-${{ inputs.working-directory }}-${{ inputs.stack-name }}-${{ inputs.deployment }}-${{ inputs.apply-environment }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write # Azure OIDC (what-if)
      pull-requests: write # plan comment
    outputs:
      has-changes: ${{ steps.plan.outputs.has-changes }}
      plan-sha256: ${{ steps.plan.outputs.plan-sha256 }}
      artifact-name: ${{ steps.plan.outputs.artifact-name }}
      comment-key: ${{ steps.plan.outputs.key }}
      title: ${{ steps.plan.outputs.title }}
      workspace-name: ${{ steps.plan.outputs.workspace-name }}
      resource-group: ${{ steps.plan.outputs.resource-group }}
    env:
      ARM_CLIENT_ID: ${{ inputs.azure-client-id || vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ inputs.azure-tenant-id || vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ inputs.azure-subscription-id || vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download template
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.template-artifact }}
          path: ${{ runner.temp }}/synapse-template

      - name: Azure login
        if: inputs.what-if
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      # Only the what-if runs a tool; without it the plan needs just jq
      - name: Set up tools
        if: inputs.what-if
        uses: $/shared/setup
        with:
          working-directory: ${{ inputs.working-directory }}
          required-tools: azure-cli
          mise-version: ${{ inputs.mise-version }}

      - name: Plan
        id: plan
        uses: $/synapse/plan
        with:
          working-directory: ${{ inputs.working-directory }}
          template-dir: ${{ runner.temp }}/synapse-template
          stack-name: ${{ inputs.stack-name }}
          deployment: ${{ inputs.deployment }}
          environment: ${{ inputs.apply-environment }}
          parameter-files: ${{ inputs.parameter-files }}
          parameters: ${{ inputs.parameters }}
          parameter-secrets: ${{ secrets.parameter-secrets }}
          resource-group: ${{ inputs.resource-group }}
          what-if: ${{ inputs.what-if }}
          delete-artifacts: ${{ inputs.delete-artifacts }}
          deploy-managed-private-endpoints: ${{ inputs.deploy-managed-private-endpoints }}
          deploy-integration-runtimes: ${{ inputs.deploy-integration-runtimes }}

      # The plan holds the template and the rendered parameters -- never the
      # parameter-secrets. Artifacts of a public repository can be downloaded
      # by any signed-in user, so keep other secrets out of parameter files.
      - name: Upload plan
        if: inputs.apply && steps.plan.outputs.has-changes == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.plan.outputs.artifact-name }}
          path: ${{ steps.plan.outputs.plan-dir }}
          if-no-files-found: error
          retention-days: ${{ inputs.plan-retention-days }}
          # A re-run uploads again under the same name; apply checks the
          # digest from this attempt's plan output either way.
          overwrite: true

      - name: Comment plan on PR
        if: ${{ !cancelled() && github.event_name == 'pull_request' && inputs.pr-comment && steps.plan.outputs.key != '' }}
        uses: $/shared/pr-comment
        with:
          comment-key: ${{ steps.plan.outputs.key }}
          title: ${{ steps.plan.outputs.title }}
          summary-file: ${{ steps.plan.outputs.summary-file || format('{0}/synapse-plan/summary.md', runner.temp) }}
          apply-environment: ${{ inputs.apply-environment }}
          apply-status: >-
            ${{
              steps.plan.outputs.has-changes != 'true' && 'none' ||
              !inputs.apply && 'none' ||
              !inputs.apply-from-pr && 'after-merge' ||
              'awaiting-approval'
            }}

  apply:
    name: Apply
    needs: plan
    # PR runs apply only with apply-from-pr; other runs (push, dispatch) only
    # on the default branch -- use environment branch policies for more.
    if: >-
      inputs.apply &&
      needs.plan.outputs.has-changes == 'true' &&
      (
        (github.event_name == 'pull_request' && inputs.apply-from-pr) ||
        (github.event_name != 'pull_request' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
      )
    runs-on: >-
      ${{
        (startsWith(inputs.apply-runs-on || inputs.runs-on, '{') || startsWith(inputs.apply-runs-on || inputs.runs-on, '['))
        && fromJSON(inputs.apply-runs-on || inputs.runs-on)
        || inputs.apply-runs-on || inputs.runs-on
      }}
    # Waits here for a reviewer's approval. Environment-scoped secrets,
    # variables and Azure federated credentials only apply once approved.
    environment: ${{ inputs.apply-environment }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # One deployment at a time per workspace, whichever workflow or
    # deployment targets it, and never cancel one that's running: that could
    # leave triggers stopped and the workspace half-published. A newer run's
    # apply queues behind.
    concurrency:
      group: synapse-apply-${{ github.repository }}-${{ needs.plan.outputs.resource-group }}-${{ needs.plan.outputs.workspace-name }}
      cancel-in-progress: false
    permissions:
      actions: read # environment protection rules; who approved, for the PR comment
      contents: read
      id-token: write # Azure OIDC (az, and the deployer's own sign-in)
      pull-requests: write # apply result comment
    outputs:
      applied: ${{ steps.apply.outcome == 'success' }}
    env:
      ARM_CLIENT_ID: ${{ inputs.apply-azure-client-id || inputs.azure-client-id || vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ inputs.azure-tenant-id || vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ inputs.azure-subscription-id || vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Before the preflight check, so a refused apply still re-posts the plan
      # summary alongside the failure.
      - name: Download plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.plan.outputs.artifact-name }}
          path: ${{ runner.temp }}/synapse-plan

      - name: Azure login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Set up tools
        uses: $/shared/setup
        with:
          working-directory: ${{ inputs.working-directory }}
          required-tools: azure-cli
          mise-version: ${{ inputs.mise-version }}

      - name: Apply
        id: apply
        uses: $/synapse/apply
        with:
          working-directory: ${{ inputs.working-directory }}
          plan-dir: ${{ runner.temp }}/synapse-plan
          plan-sha256: ${{ needs.plan.outputs.plan-sha256 }}
          parameter-secrets: ${{ secrets.parameter-secrets }}
          delete-artifacts: ${{ inputs.delete-artifacts }}
          deploy-managed-private-endpoints: ${{ inputs.deploy-managed-private-endpoints }}
          manage-triggers: ${{ inputs.manage-triggers }}
          environment: ${{ inputs.apply-environment }}
          preflight-paths: ${{ inputs.preflight-paths }}

      - name: Comment apply result on PR
        if: ${{ !cancelled() && github.event_name == 'pull_request' && inputs.pr-comment }}
        uses: $/shared/pr-comment
        with:
          comment-key: ${{ needs.plan.outputs.comment-key }}
          title: ${{ needs.plan.outputs.title }}
          summary-file: ${{ runner.temp }}/synapse-plan/summary.md
          apply-environment: ${{ inputs.apply-environment }}
          apply-status: ${{ steps.apply.outcome == 'success' && 'succeeded' || 'failed' }}
