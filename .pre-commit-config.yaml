repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: ["-x"]
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      # -system: uses the actionlint pinned in mise.toml instead of building
      # it from source with Go
      - id: actionlint-system
      # The consumer examples are workflows too, just not in .github/
      - id: actionlint-system
        name: actionlint (examples)
        files: ^examples/.*\.ya?ml$
  - repo: local
    hooks:
      - id: check-workflow-inputs
        name: Reusable workflows' shared inputs in sync
        entry: .github/scripts/check-workflow-inputs.sh
        language: system
        files: ^\.github/(workflows/(opentofu|datafactory|synapse).*\.yaml|scripts/check-workflow-inputs\.sh)$
        pass_filenames: false
      - id: check-no-inline-scripts
        name: No inline scripts in run steps
        entry: .github/scripts/check-no-inline-scripts.sh
        language: system
        files: (^\.github/workflows/|/action\.ya?ml$|^examples/|^\.github/scripts/check-no-inline-scripts\.sh$)
        pass_filenames: false
  # Security audit of the workflows and composite actions (template
  # injection, excessive permissions, unpinned actions, ...)
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2
  # The test fixture should itself pass the checks the actions run
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.99.5
    hooks:
      - id: terraform_fmt
        args:
          - --hook-config=--tf-path=tofu
      - id: terraform_docs
        args:
          - --hook-config=--tf-path=tofu
      - id: terraform_tflint
        args:
          - --hook-config=--tf-path=tofu
